<style>
  :root{
    --bg: #EEF0E7;
    --bg-deep: #E6E9DE;
    --paper: #F8F8F3;
    --fill: #E9ECE1;
    --ink: #232C24;
    --ink-soft: #6B776C;
    --ink-faint: #9AA39B;
    --line: rgba(35,44,36,0.13);
    --rose: #B8523E;
    --rose-soft: #F1DCD2;
    --rose-deep: #8F3C2C;
    --teal: #2E6E6A;
    --teal-soft: #D9E8E3;
    --teal-deep: #204F4C;
    --amber: #C99A2E;
    --amber-soft: #F3E7CE;
    --amber-deep: #8C6A18;
    --radius: 10px;
    --radius-lg: 14px;
    --tap: 44px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }
  html,body{margin:0; height:100%;}
  body{
    background:#D3D8CA;
    font-family:var(--sans);
    color:var(--ink);
    font-size:17px;
    line-height:1.42;
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
    min-height:100dvh;
  }
  h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-0.022em;}
  button{font-family:inherit; font-size:17px; letter-spacing:-0.01em;}
  input,textarea,select{font-family:inherit; letter-spacing:-0.01em;}
  :focus-visible{outline:3px solid var(--teal); outline-offset:2px; border-radius:6px;}

  .device{
    width:100%; max-width:428px;
    min-height:100dvh;
    background:var(--bg);
    display:flex; flex-direction:column;
    position:relative;
  }
  @media (min-width:429px){
    body{ padding:26px 0; }
    .device{ border-radius:44px; overflow:hidden; min-height:calc(100dvh - 52px); box-shadow:0 20px 60px rgba(20,26,20,0.30); }
  }

  /* NAVIGATION BAR — iOS large title */
  .appbar{
    padding:calc(10px + var(--safe-t)) 20px 12px;
    background:rgba(238,240,231,0.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:0.5px solid var(--line);
    display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:20;
  }
  .appbar .mark{
    width:38px; height:38px; border-radius:9px; background:var(--ink);
    color:var(--rose); display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; flex:none;
  }
  .appbar .title{font-size:26px; font-weight:700; letter-spacing:-0.028em; line-height:1.15;}
  .appbar .subtitle{
    font-size:12px; letter-spacing:0.02em; color:var(--ink-soft); margin-top:1px; font-weight:400;
  }

  .screens{flex:1; overflow:hidden; position:relative;}
  .screen{
    position:absolute; inset:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(28px + var(--safe-b));
    display:none;
  }
  .screen.active{display:block;}

  /* Section footnote under the nav bar */
  .section-lede{font-size:13px; color:var(--ink-soft); margin:0 4px 16px; line-height:1.38;}

  /* DAY SELECTOR — scrollable pills */
  .day-selector{
    display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; margin-bottom:6px;
    scroll-snap-type:x proximity;
  }
  .day-selector::-webkit-scrollbar{display:none;}
  .day-chip{
    flex:none; scroll-snap-align:start;
    min-height:36px; font-size:15px; font-weight:600;
    border:none; background:var(--fill); color:var(--ink-soft);
    border-radius:100px; padding:8px 15px; cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .day-chip.active{background:var(--ink); color:var(--bg);}

  .day-panel{display:none;}
  .day-panel.active{display:block; animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

  .day-title-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 4px 12px;}
  .day-title-row h2{font-size:28px; font-weight:700; letter-spacing:-0.03em;}
  .day-base-pill{
    font-size:12px; font-weight:600; letter-spacing:0.01em;
    color:var(--ink-soft); background:var(--fill); border-radius:100px; padding:5px 10px; white-space:nowrap;
  }

  /* GROUPED CARDS */
  .block{
    background:var(--paper); border-radius:var(--radius-lg);
    padding:14px 16px; margin-top:12px;
    border-left:4px solid transparent;
  }
  .block.am{border-left-color:var(--rose);}
  .block.pm{border-left-color:var(--teal);}
  .block.travel{border-left-color:var(--ink);}
  .block.custom{border-left-color:var(--amber);}
  .block .tag{
    font-size:12px; font-weight:600; letter-spacing:0.01em;
    display:inline-block; padding:4px 10px; border-radius:100px; margin-bottom:8px;
  }
  .block.am .tag{background:var(--rose-soft); color:var(--rose-deep);}
  .block.pm .tag{background:var(--teal-soft); color:var(--teal-deep);}
  .block.custom .tag{background:var(--amber-soft); color:var(--amber-deep);}
  .block-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .block h4{font-size:17px; font-weight:600; margin-bottom:3px;}
  .block p{margin:0; font-size:15px; color:var(--ink-soft); line-height:1.4;}
  .loc-google-link{
    display:inline-flex; align-items:center; min-height:var(--tap); margin-top:2px;
    font-size:15px; font-weight:500; color:var(--teal); text-decoration:none;
  }
  .loc-google-link::after{content:'›'; margin-left:5px; font-size:19px; color:var(--ink-faint); line-height:1;}
  .block .note{
    margin-top:8px; font-size:13px; color:var(--rose-deep); line-height:1.36;
  }

  /* STOP CARDS */
  .stops-group-label{
    font-size:13px; letter-spacing:0.01em; text-transform:uppercase;
    color:var(--ink-soft); margin:0 4px 2px;
  }
  .stops-group-label.second{margin-top:26px;}
  .stops-group-empty{
    font-size:15px; color:var(--ink-soft); background:var(--paper);
    border-radius:var(--radius-lg); padding:14px 16px; margin-top:12px;
  }
  .stop-card{margin-top:12px;}
  .stop-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .stop-select{
    -webkit-appearance:none; appearance:none;
    font-size:15px; font-weight:600;
    border:none; border-radius:100px; padding:8px 26px 8px 12px; min-height:36px;
    background-color:var(--fill); color:var(--ink); cursor:pointer;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%236B776C' d='M4.5 6.5 8 10l3.5-3.5'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 8px center; background-size:14px;
  }
  .stop-period-select.am{background-color:var(--rose-soft); color:var(--rose-deep);}
  .stop-period-select.pm{background-color:var(--teal-soft); color:var(--teal-deep);}
  .stop-period-select.travel{background-color:var(--bg-deep); color:var(--ink);}
  .stop-custom-badge{
    font-size:12px; font-weight:600;
    background:var(--amber-soft); color:var(--amber-deep); border-radius:100px; padding:5px 10px;
  }
  .stop-top-spacer{flex:1;}
  .stop-remove{
    border:none; background:none; color:var(--rose); font-size:22px; line-height:1; cursor:pointer;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .stop-name{font-size:17px; font-weight:600; margin-bottom:10px; letter-spacing:-0.022em;}
  .stop-desc-input{
    width:100%; min-height:60px; resize:vertical; border:none; border-radius:var(--radius);
    padding:11px 12px; font-size:15px; color:var(--ink); background:var(--fill); line-height:1.4;
  }
  .stop-warning-input{
    width:100%; min-height:var(--tap); margin-top:8px; padding:11px 12px; border:none; border-radius:var(--radius);
    font-size:15px; color:var(--rose-deep); background:var(--fill);
  }
  .stop-warning-input::placeholder, .stop-desc-input::placeholder{color:var(--ink-faint);}
  .stop-promote{
    display:flex; align-items:center; min-height:var(--tap); margin-top:2px;
    border:none; background:none; color:var(--teal); font-size:15px; font-weight:500; cursor:pointer; padding:0;
  }
  .stop-add-btn{
    width:100%; min-height:var(--tap); padding:12px; border:none; border-radius:var(--radius-lg);
    background:var(--paper); color:var(--teal); font-size:16px; font-weight:600; cursor:pointer; margin-top:12px;
  }
  .stop-add-btn:active{background:var(--bg-deep);}
  .extra-booking-add-btn{
    width:100%; min-height:var(--tap); padding:12px; border:none; border-radius:var(--radius-lg);
    background:var(--paper); color:var(--teal); font-size:16px; font-weight:600; cursor:pointer; margin-top:12px;
  }
  .extra-booking-add-btn:active{background:var(--bg-deep);}

  .day-arrows{display:flex; gap:10px; margin-top:22px;}
  .arrow-btn{
    flex:1; min-height:var(--tap); padding:12px; border-radius:var(--radius-lg); border:none;
    background:var(--paper); color:var(--teal); font-size:16px; font-weight:600; cursor:pointer;
  }
  .arrow-btn:disabled{color:var(--ink-faint);}
  .arrow-btn:active:not(:disabled){background:var(--bg-deep);}

  /* GROUPED SECTIONS INSIDE A DAY */
  .day-extra{margin-top:26px;}
  .extra-block{margin-top:24px;}
  .extra-label{
    font-size:13px; font-weight:400; letter-spacing:0.01em; text-transform:uppercase;
    color:var(--ink-soft); margin:0 4px 8px;
  }
  .notes-input{
    width:100%; min-height:52px; resize:none; overflow:hidden; border:none; border-radius:var(--radius-lg);
    padding:13px 15px; font-size:16px; color:var(--ink); background:var(--paper); line-height:1.42;
  }
  .notes-input::placeholder{color:var(--ink-faint);}

  /* ALOJAMENTO */
  .base-card{
    background:var(--paper); border-radius:var(--radius-lg);
    padding:18px 16px; margin-bottom:18px;
  }
  .base-card .base-no{font-size:13px; color:var(--ink-soft); letter-spacing:0.01em;}
  .base-card h3{font-size:22px; margin-top:3px; letter-spacing:-0.026em;}
  .base-card .nights{margin-top:3px; font-size:15px; font-weight:500; color:var(--rose);}
  .base-card.two .nights{color:var(--teal);}
  .base-card.car .base-no{color:var(--amber-deep);}
  .base-card p{color:var(--ink-soft); font-size:15px; margin-top:8px; line-height:1.4;}
  .reach{list-style:none; margin:14px 0 0; padding:0;}
  .reach li{
    display:flex; justify-content:space-between; gap:12px; font-size:16px;
    border-top:0.5px solid var(--line); padding:11px 0 11px 0;
  }
  .reach li:first-child{border-top:none;}
  .reach li span:last-child{color:var(--ink-soft);}
  .booking-link{margin-top:12px; padding-top:12px; border-top:0.5px solid var(--line);}
  .attachment-list{display:flex; flex-direction:column; margin-bottom:4px;}
  .attachment-item{
    display:flex; align-items:center; gap:8px; min-height:var(--tap);
    border-top:0.5px solid var(--line);
  }
  .attachment-item:first-child{border-top:none;}
  .attachment-link{
    flex:1; min-width:0; display:flex; align-items:center; gap:8px;
    font-size:16px; font-weight:500; color:var(--teal); text-decoration:none;
  }
  .attachment-link .attachment-icon{flex:none; font-size:15px;}
  .attachment-link .attachment-label{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .attachment-remove{
    flex:none; border:none; background:none; color:var(--rose); font-size:20px; line-height:1; cursor:pointer;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }
  .booking-link-edit-row{display:flex; gap:8px; align-items:center;}
  .booking-link-input{
    flex:1; min-width:0; min-height:var(--tap); padding:11px 12px; border:none; border-radius:var(--radius);
    font-size:16px; color:var(--ink); background:var(--fill);
  }
  .booking-link-input::placeholder{color:var(--ink-faint);}
  .booking-link-save{
    flex:none; min-height:var(--tap); padding:11px 16px; border-radius:var(--radius); border:none;
    background:var(--teal); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  }
  .booking-link-save:active{opacity:0.75;}
  .booking-file-btn{
    display:flex; align-items:center; justify-content:center; min-height:var(--tap); margin-top:8px;
    border-radius:var(--radius); background:var(--fill); color:var(--teal-deep);
    font-size:15px; font-weight:500; cursor:pointer; text-align:center;
  }
  .booking-file-btn:active{background:var(--bg-deep);}
  .extra-bookings-list{display:flex; flex-direction:column;}
  .extra-booking-card{
    background:var(--paper); border-radius:var(--radius-lg);
    padding:14px 16px; margin-top:12px;
  }
  .extra-booking-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
  .extra-booking-top h3{font-size:17px; letter-spacing:-0.02em;}
  .extra-booking-remove{
    flex:none; border:none; background:none; color:var(--rose); font-size:22px; line-height:1; cursor:pointer;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }

  /* MAPA */
  #map{width:100%; height:52vh; min-height:320px; border-radius:var(--radius-lg); background:#E4E7DC;}
  .legend{
    display:flex; flex-direction:column; margin-top:16px; font-size:15px; color:var(--ink);
    background:var(--paper); border-radius:var(--radius-lg); padding:0 15px;
  }
  .legend span{display:flex; align-items:center; padding:12px 0; border-top:0.5px solid var(--line);}
  .legend span:first-child{border-top:none;}
  .legend .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:12px; flex:none;}
  .legend .dot.rose{background:var(--rose);}
  .legend .dot.teal{background:var(--teal);}
  .legend .dot.ink{background:var(--ink);}
  .legend .dot.amber{background:var(--amber);}

  /* NOTAS */
  .note-card{
    background:var(--paper); border-radius:var(--radius-lg);
    padding:16px; margin-bottom:12px;
  }
  .note-card .eyebrow{font-size:13px; letter-spacing:0.01em; text-transform:uppercase; color:var(--rose);}
  .note-card h4{font-size:17px; margin:5px 0 5px;}
  .note-card p{margin:0; font-size:15px; color:var(--ink-soft); line-height:1.42;}
  .reset-link{
    display:block; margin-top:14px; min-height:var(--tap); text-align:center; font-size:16px; font-weight:500;
    color:var(--rose); text-decoration:none; background:var(--paper); border:none; border-radius:var(--radius-lg);
    cursor:pointer; width:100%; padding:13px 16px;
  }
  .reset-link:active{background:var(--bg-deep);}

  /* CUSTOS */
  .whoami-row{
    font-size:16px; color:var(--ink-soft); margin-bottom:18px; background:var(--paper);
    border-radius:var(--radius-lg); padding:13px 15px; display:flex; align-items:center; gap:8px;
  }
  .whoami-row strong{color:var(--ink); font-weight:600;}
  .whoami-row button{
    margin-left:auto; border:none; background:none; color:var(--teal); font-size:16px;
    font-weight:500; cursor:pointer; min-height:32px; padding:0 2px;
  }
  .cost-summary{margin-bottom:20px;}
  .cost-empty{font-size:15px; color:var(--ink-soft); background:var(--paper); border-radius:var(--radius-lg); padding:15px;}
  .cost-total-row{
    display:flex; justify-content:space-between; align-items:center; font-size:16px;
    background:var(--paper); padding:12px 15px; border-top:0.5px solid var(--line);
  }
  .cost-total-row:first-child{border-top:none; border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
  .cost-total-row:last-of-type{border-radius:0 0 var(--radius-lg) var(--radius-lg);}
  .cost-total-row.total{font-weight:700; font-size:17px;}
  .cost-total-row span:last-child{color:var(--ink-soft);}
  .cost-total-row.total span:last-child{color:var(--ink);}
  .cost-settle{
    margin-top:14px; padding:14px 15px; border-radius:var(--radius-lg); background:var(--rose-soft); color:var(--rose-deep);
    font-size:16px; font-weight:600;
  }
  .cost-settle.even{background:var(--teal-soft); color:var(--teal-deep);}
  .cost-add-row{display:flex; gap:8px; margin-bottom:10px;}
  .cost-desc-input{
    flex:1; min-width:0; min-height:var(--tap); padding:12px; border:none; border-radius:var(--radius);
    font-size:16px; color:var(--ink); background:var(--paper);
  }
  .cost-amount-input{
    width:112px; flex:none; min-height:var(--tap); padding:12px; border:none; border-radius:var(--radius);
    font-size:16px; color:var(--ink); background:var(--paper);
  }
  .cost-desc-input::placeholder, .cost-amount-input::placeholder{color:var(--ink-faint);}
  .cost-add-btn{
    width:100%; min-height:var(--tap); padding:13px; border-radius:var(--radius-lg); border:none; margin-bottom:22px;
    background:var(--teal); color:#fff; font-size:17px; font-weight:600; cursor:pointer;
  }
  .cost-add-btn:active{opacity:0.75;}
  .cost-list{display:flex; flex-direction:column; background:var(--paper); border-radius:var(--radius-lg); overflow:hidden;}
  .cost-item{
    display:flex; align-items:center; gap:10px; padding:12px 15px; border-top:0.5px solid var(--line);
  }
  .cost-item:first-child{border-top:none;}
  .cost-item-main{flex:1; min-width:0;}
  .cost-item-desc{display:block; font-size:16px; color:var(--ink); font-weight:500;}
  .cost-item-who{display:block; font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .cost-item-amount{flex:none; font-size:16px; color:var(--ink-soft);}
  .cost-edit{
    flex:none; border:none; background:none; font-size:16px; cursor:pointer;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }
  .cost-remove{
    flex:none; border:none; background:none; color:var(--rose); font-size:22px; line-height:1; cursor:pointer;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }

  /* RESERVAS */
  .resv-add-row{display:flex; gap:8px; margin-top:10px;}
  .resv-add-input{
    flex:1; min-width:0; min-height:var(--tap); padding:12px; border:none; border-radius:var(--radius);
    font-size:16px; color:var(--ink); background:var(--paper);
  }
  .resv-add-input::placeholder{color:var(--ink-faint);}
  .resv-add-btn{
    flex:none; min-height:var(--tap); padding:12px 16px; border-radius:var(--radius); border:none;
    background:var(--teal); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  }
  .resv-add-btn:active{opacity:0.75;}
  .resv-list{display:flex; flex-direction:column; background:var(--paper); border-radius:var(--radius-lg); overflow:hidden;}
  .resv-empty{font-size:15px; color:var(--ink-soft); padding:14px 15px;}
  .resv-item{
    display:flex; align-items:center; gap:12px; padding:12px 15px; border-top:0.5px solid var(--line);
  }
  .resv-item:first-child{border-top:none;}
  .resv-check{
    flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink-faint);
    background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .resv-check svg{width:14px; height:14px; opacity:0; stroke:#fff;}
  .resv-item.done .resv-check{background:var(--teal); border-color:var(--teal);}
  .resv-item.done .resv-check svg{opacity:1;}
  .resv-title{flex:1; font-size:16px; color:var(--ink); word-break:break-word;}
  .resv-item.done .resv-title{color:var(--ink-faint);}
  .resv-remove{
    flex:none; border:none; background:none; color:var(--rose); font-size:22px; line-height:1; cursor:pointer;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  }

  /* TAB BAR — iOS translucent */
  .tabbar{
    display:flex;
    background:rgba(248,248,243,0.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:0.5px solid var(--line);
    padding:6px 4px calc(6px + var(--safe-b));
  }
  .tab{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:5px 2px; color:var(--ink-faint); cursor:pointer; min-height:var(--tap);
  }
  .tab svg{width:25px; height:25px; stroke-width:1.7;}
  .tab span{font-size:10px; font-weight:500; letter-spacing:0.005em;}
  .tab.active{color:var(--rose);}
  .tab.active svg{stroke:var(--rose);}

  /* ============ MULTI-VIAGEM ============ */
  [hidden]{display:none !important;}
  .device{height:100dvh; overflow:hidden;}
  @media (min-width:429px){ .device{height:calc(100dvh - 52px);} }
  .view{flex:1; min-height:0; display:flex; flex-direction:column;}

  .appbar-text{flex:1; min-width:0;}
  .appbar-text .title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .back-btn{
    flex:none; width:var(--tap); height:var(--tap); margin-left:-10px; margin-right:-8px; border:none; background:none;
    color:var(--teal); font-size:34px; line-height:1; cursor:pointer; padding:0 0 4px;
  }
  .appbar-action{
    flex:none; border:none; background:none; color:var(--teal); font-size:17px; cursor:pointer;
    min-height:var(--tap); padding:0 2px;
  }

  .home-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(28px + var(--safe-b));}
  .trip-list{display:flex; flex-direction:column; gap:14px; margin-bottom:14px;}
  .trip-card{
    display:block; width:100%; text-align:left; border:none; padding:0; cursor:pointer;
    background:var(--paper); border-radius:var(--radius-lg); overflow:hidden; color:var(--ink);
  }
  .trip-card:active{opacity:0.8;}
  .trip-cover{
    height:104px; position:relative; background-size:cover; background-position:center;
    display:flex; align-items:flex-end; padding:12px 16px;
  }
  .trip-cover svg{position:absolute; inset:0; width:100%; height:100%;}
  .trip-cover-days{
    position:relative; font-size:12px; font-weight:600; color:#fff; background:rgba(35,44,36,0.55);
    border-radius:100px; padding:4px 10px;
  }
  .cover-rose{background-color:var(--rose);}
  .cover-teal{background-color:var(--teal);}
  .cover-amber{background-color:var(--amber);}
  .cover-ink{background-color:var(--ink);}
  .cover-moss{background-color:#6B7F4F;}
  .trip-card-body{padding:12px 16px 14px;}
  .trip-card-name{font-size:20px; font-weight:700; letter-spacing:-0.024em;}
  .trip-card-meta{font-size:15px; color:var(--ink-soft); margin-top:2px;}
  .home-empty{
    background:var(--paper); border-radius:var(--radius-lg); padding:22px 16px; font-size:15px; color:var(--ink-soft);
  }
  .home-empty strong{display:block; color:var(--ink); font-size:17px; margin-bottom:4px;}
  .primary-btn{
    width:100%; min-height:50px; border:none; border-radius:var(--radius-lg);
    background:var(--teal); color:#fff; font-size:17px; font-weight:600; cursor:pointer;
  }
  .primary-btn:active{opacity:0.75;}

  /* Day title (editable) */
  .day-title-input{
    flex:1; min-width:0; border:none; background:none; padding:0; color:var(--ink);
    font-size:28px; font-weight:700; letter-spacing:-0.03em; border-radius:6px;
  }
  .day-title-input::placeholder{color:var(--ink-faint);}
  .day-date{font-size:13px; color:var(--ink-soft); margin:0 4px 14px; text-transform:uppercase; letter-spacing:0.01em;}

  /* Booking cards */
  .booking-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .booking-edit{
    flex:none; border:none; background:none; color:var(--teal); font-size:15px; cursor:pointer;
    min-height:32px; padding:0 2px;
  }
  .base-card .base-no.lodging-1{color:var(--teal-deep);}
  .base-card.nights-1 .nights{color:var(--teal);}
  .base-card.nights-2 .nights{color:#6B7F4F;}
  .bookings-empty, .tips-empty{
    background:var(--paper); border-radius:var(--radius-lg); padding:16px; font-size:15px; color:var(--ink-soft); margin-bottom:12px;
  }

  /* Tips */
  .tip-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}

  /* Sheet */
  .sheet-backdrop{
    position:absolute; inset:0; z-index:1200; background:rgba(35,44,36,0.38);
    display:flex; align-items:flex-end;
  }
  .sheet{
    width:100%; max-height:92%; background:var(--bg); border-radius:16px 16px 0 0;
    display:flex; flex-direction:column; animation:sheetUp .24s ease;
  }
  @keyframes sheetUp{from{transform:translateY(40px); opacity:0;} to{transform:none; opacity:1;}}
  .sheet-bar{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:0.5px solid var(--line);
  }
  .sheet-title{flex:1; text-align:center; font-size:17px; font-weight:600;}
  .sheet-cancel, .sheet-save{
    border:none; background:none; color:var(--teal); font-size:17px; cursor:pointer; min-height:var(--tap); padding:0 4px;
  }
  .sheet-save{font-weight:600;}
  .sheet-save:disabled{color:var(--ink-faint);}
  .sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px calc(26px + var(--safe-b));}
  .field{margin-bottom:16px;}
  .field-label{font-size:13px; text-transform:uppercase; letter-spacing:0.01em; color:var(--ink-soft); margin:0 4px 7px; display:block;}
  .field-input{
    width:100%; min-height:var(--tap); padding:11px 13px; border:none; border-radius:var(--radius);
    font-size:17px; color:var(--ink); background:var(--paper); -webkit-appearance:none; appearance:none;
  }
  textarea.field-input{min-height:96px; resize:vertical; line-height:1.4;}
  .field-input::placeholder{color:var(--ink-faint);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1; min-width:0;}
  .field-hint{font-size:13px; color:var(--ink-soft); margin:7px 4px 0; line-height:1.36;}
  .field-error{font-size:15px; color:var(--rose-deep); background:var(--rose-soft); border-radius:var(--radius); padding:11px 13px; margin-bottom:16px;}
  .swatches{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:0 4px;}
  .swatch{
    width:38px; height:38px; border-radius:50%; border:3px solid var(--bg); cursor:pointer; padding:0;
    box-shadow:0 0 0 1.5px transparent;
  }
  .swatch.selected{box-shadow:0 0 0 2.5px var(--ink);}
  .cover-photo-btn{
    display:flex; align-items:center; justify-content:center; min-height:var(--tap); margin-top:12px;
    border-radius:var(--radius); background:var(--paper); color:var(--teal); font-size:16px; font-weight:500; cursor:pointer;
  }
  .segmented{display:flex; background:var(--fill); border-radius:9px; padding:2px;}
  .segmented button{
    flex:1; min-height:36px; border:none; background:none; border-radius:7px; font-size:15px; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .segmented button.selected{background:var(--paper); font-weight:600; box-shadow:0 1px 3px rgba(35,44,36,0.14);}
  .danger-btn{
    width:100%; min-height:var(--tap); margin-top:10px; border:none; border-radius:var(--radius-lg);
    background:var(--paper); color:var(--rose); font-size:17px; cursor:pointer;
  }
  .danger-btn:active{background:var(--bg-deep);}

  .toast{
    position:absolute; left:16px; right:16px; bottom:calc(84px + var(--safe-b)); z-index:1300;
    background:var(--ink); color:var(--bg); font-size:15px; border-radius:var(--radius-lg); padding:12px 15px; text-align:center;
  }

  /* Place search */
  .place-list{background:var(--paper); border-radius:var(--radius-lg); overflow:hidden;}
  .place-result{
    display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer; color:var(--ink);
    padding:11px 14px; min-height:var(--tap); border-bottom:0.5px solid var(--line);
  }
  .place-result:last-child{border-bottom:none;}
  .place-result:active{background:var(--bg-deep);}
  .place-name{display:block; font-size:17px; font-weight:500;}
  .place-where{display:block; font-size:13px; color:var(--ink-soft); margin-top:2px; line-height:1.35;}
  .place-result.manual .place-name{color:var(--teal); font-weight:400; font-size:16px;}
  .place-status{font-size:15px; color:var(--ink-soft); margin:0 4px 12px;}

  /* Delete confirmation */
  .sheet-save.danger{color:var(--rose);}
  .confirm-card{background:var(--paper); border-radius:var(--radius-lg); padding:16px; margin-bottom:16px; font-size:15px; color:var(--ink-soft);}
  .confirm-title{font-size:20px; font-weight:700; letter-spacing:-0.024em; color:var(--ink);}
  .confirm-meta{margin-top:2px;}
  .confirm-card p{margin:14px 0 6px;}
  .confirm-card ul{margin:0; padding-left:20px; color:var(--ink); line-height:1.5;}
  .confirm-card .confirm-warn{color:var(--rose); font-weight:600; margin-bottom:0;}
  .danger-btn.solid{background:var(--rose); color:#fff; font-weight:600; margin-top:0;}
  .danger-btn.solid:active{opacity:0.8; background:var(--rose);}
  .danger-btn.keep{color:var(--teal);}

  /* Navigate */
  .stop-links{display:flex; align-items:center; flex-wrap:wrap; gap:6px 16px; margin-top:10px;}
  .stop-links .loc-google-link{margin-top:0;}
  .nav-link{
    display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:100px;
    background:var(--teal); color:#fff; font-size:15px; font-weight:600; text-decoration:none;
  }
  .nav-link:active{opacity:0.75;}
  .nav-link svg{width:15px; height:15px;}
  .nav-link.booking-nav{margin-top:12px;}

  /* Order, time, driving legs */
  .stop-wrap{position:relative;}
  .stop-wrap.dragging{z-index:5;}
  .stop-wrap.dragging .stop-card{box-shadow:0 10px 28px rgba(35,44,36,0.22); opacity:0.96;}
  .stop-wrap.dragging .leg{visibility:hidden;}
  .stop-drag{
    flex:none; width:32px; height:36px; margin-left:-8px; border:none; background:none; color:var(--ink-faint);
    cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none; display:flex; align-items:center; justify-content:center;
  }
  .stop-drag svg{width:20px; height:20px; pointer-events:none;}
  .stop-name-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .stop-name-row .stop-name{flex:1; min-width:0; margin-bottom:0;}
  .stop-time{
    flex:none; display:flex; align-items:center; gap:6px; background:var(--fill); border-radius:100px; padding:0 10px 0 12px; min-height:36px;
    font-size:13px; color:var(--ink-soft);
  }
  .stop-time.set span{display:none;}
  .stop-time-input{
    border:none; background:none; font-size:15px; font-weight:600; color:var(--ink); font-family:inherit; min-height:34px; padding:0;
    -webkit-appearance:none; appearance:none;
  }
  .stop-time:not(.set) .stop-time-input{color:var(--ink-faint); font-weight:400;}
  .leg{display:flex; align-items:center; gap:10px; padding:10px 6px 0 22px; font-size:13px; color:var(--ink-soft);}
  .leg:empty{display:none;}
  .leg-line{width:2px; height:18px; border-radius:2px; background:var(--line);}
  .leg-total{font-size:13px; color:var(--ink-soft); margin:12px 4px 0; font-weight:600;}
  .leg-total:empty{display:none;}

  /* Ideas */
  #ideasList{margin-top:12px;}
  .idea-list{background:var(--paper); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:12px;}
  .idea-item{display:flex; align-items:flex-start; gap:8px; padding:12px 10px 12px 16px; border-bottom:0.5px solid var(--line);}
  .idea-item:last-child{border-bottom:none;}
  .idea-main{flex:1; min-width:0;}
  .idea-name{font-size:17px; font-weight:600; letter-spacing:-0.022em;}
  .idea-desc{font-size:15px; color:var(--ink-soft); margin-top:2px;}
  .idea-day-select{margin-top:10px; background-color:var(--fill); color:var(--teal); max-width:100%;}
  .notes-label{margin-bottom:12px;}

  /* Costs: people, categories */
  .people-list{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 6px;}
  .person-chip{
    display:inline-flex; align-items:center; gap:4px; min-height:36px; padding:0 14px; border-radius:100px; border:none;
    background:var(--paper); color:var(--ink); font-size:15px; font-weight:500;
  }
  .person-chip.me{background:var(--teal-soft); color:var(--teal-deep); font-weight:600;}
  .person-chip.add{color:var(--teal); cursor:pointer;}
  .person-remove{border:none; background:none; color:var(--ink-faint); font-size:19px; line-height:1; cursor:pointer; padding:0 0 0 4px; min-height:36px;}
  .cost-total-row small{display:block; font-size:13px; color:var(--ink-soft); font-weight:400; margin-top:1px;}
  .cat-list{background:var(--paper); border-radius:var(--radius-lg); padding:6px 16px; margin:10px 0 20px;}
  .cat-row{padding:10px 0; border-bottom:0.5px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-head{display:flex; justify-content:space-between; gap:10px; font-size:15px; color:var(--ink);}
  .cat-head span:last-child{color:var(--ink-soft); flex:none;}
  .cat-bar{height:6px; border-radius:6px; background:var(--fill); margin-top:7px; overflow:hidden;}
  .cat-bar span{display:block; height:100%; border-radius:6px; background:var(--teal);}
  .cost-add-btn{margin-bottom:16px;}
  .cost-item{cursor:pointer;}
  .cost-cat{flex:none; width:32px; height:32px; border-radius:50%; background:var(--fill); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    min-height:38px; padding:0 14px; border-radius:100px; border:none; background:var(--paper); color:var(--ink);
    font-size:15px; font-weight:500; cursor:pointer;
  }
  .chip.selected{background:var(--teal); color:#fff; font-weight:600;}
  .chip.check.selected::before{content:'✓ ';}
  .chip.add{color:var(--teal); background:none; box-shadow:inset 0 0 0 1.5px var(--line);}

  /* Despesas: sub-tabs */
  .cost-tabs{margin-bottom:16px;}
  .cost-list-total{font-size:13px; text-transform:uppercase; letter-spacing:0.01em; color:var(--ink-soft); margin:0 4px 8px;}
  .cost-list-total:empty{display:none;}

  /* Settle up */
  .settle-label{margin:18px 4px 8px;}
  .cost-settle{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cost-settle.even{display:block;}
  .settle-btn{
    flex:none; border:none; border-radius:100px; min-height:36px; padding:0 14px; cursor:pointer;
    background:var(--rose); color:#fff; font-size:15px; font-weight:600;
  }
  .settle-btn:active{opacity:0.75;}
  .settle-list{margin:10px 0 20px;}
  .settle-item{cursor:default;}
  .settle-item .cost-cat{background:var(--teal-soft); color:var(--teal-deep); font-weight:700;}
  .settle-undo{flex:none; border:none; background:none; color:var(--teal); font-size:15px; cursor:pointer; min-height:var(--tap); padding:0 2px;}

  /* ============ UX: FAB, toast with undo ============ */
  .device{position:relative;}
  .fab{
    position:absolute; right:18px; bottom:calc(22px + var(--safe-b)); z-index:900;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(35,44,36,0.28);
  }
  .fab.in-trip{bottom:calc(74px + var(--safe-b));}
  .fab:active{transform:scale(0.94);}
  .fab svg{width:26px; height:26px;}
  .screen, .home-scroll{padding-bottom:calc(96px + var(--safe-b));}
  .toast{bottom:calc(142px + var(--safe-b)); display:flex; align-items:center; justify-content:center; gap:14px; text-align:left;}
  .toast-undo{flex:none; border:none; background:none; color:#F0C96A; font-size:15px; font-weight:700; cursor:pointer; min-height:32px; padding:0 2px;}
  .choice-btn{
    display:block; width:100%; text-align:left; border:none; background:var(--paper); border-radius:var(--radius-lg);
    padding:14px 16px; margin-bottom:10px; cursor:pointer; color:var(--ink);
  }
  .choice-btn strong{display:block; font-size:17px; font-weight:600;}
  .choice-btn span{display:block; font-size:14px; color:var(--ink-soft); margin-top:2px;}
  .choice-btn:active{background:var(--bg-deep);}
  .inline-add{display:flex; gap:8px; align-items:center; margin-top:10px;}
  .inline-add .field-input{flex:1; min-width:0;}

  /* ============ Home with context ============ */
  .home-label{font-size:13px; text-transform:uppercase; letter-spacing:0.01em; color:var(--ink-soft); margin:0 4px -4px;}
  .home-label.second{margin-top:12px;}
  .trip-cover-days.now{background:var(--teal); }
  .trip-past-list{background:var(--paper); border-radius:var(--radius-lg); overflow:hidden;}
  .trip-card.past{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:0; background:none; border-bottom:0.5px solid var(--line);}
  .trip-card.past:last-child{border-bottom:none;}
  .trip-thumb{flex:none; width:44px; height:44px; border-radius:10px; background-size:cover; background-position:center; opacity:0.75;}
  .trip-card.past .trip-card-body{flex:1; min-width:0; padding:0; display:block;}
  .trip-card.past .trip-card-name{display:block; font-size:17px; font-weight:600;}
  .trip-card.past .trip-card-meta{display:block; font-size:13px;}
  .trip-chevron{flex:none; color:var(--ink-faint); font-size:22px; line-height:1;}

  /* ============ Today card ============ */
  .today-card{background:var(--ink); color:var(--bg); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:14px;}
  .today-top{display:flex; align-items:center; gap:8px; font-size:13px;}
  .today-badge{background:var(--amber); color:var(--ink); font-weight:700; border-radius:100px; padding:3px 9px; font-size:12px; text-transform:uppercase; letter-spacing:0.02em;}
  .today-date{flex:1; min-width:0; opacity:0.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .today-go{border:none; background:none; color:#F0C96A; font-size:14px; font-weight:600; cursor:pointer; min-height:28px; padding:0;}
  .today-next{display:flex; align-items:center; gap:12px; margin-top:12px;}
  .today-main{flex:1; min-width:0;}
  .today-kicker{font-size:12px; text-transform:uppercase; letter-spacing:0.02em; opacity:0.65;}
  .today-name{font-size:20px; font-weight:700; letter-spacing:-0.024em; margin-top:1px;}
  .today-time{font-variant-numeric:tabular-nums; margin-right:8px; color:#F0C96A;}
  .today-warn{font-size:13px; opacity:0.85; margin-top:3px;}
  .today-empty{font-size:15px; opacity:0.85; margin-top:10px;}
  .today-card .nav-link{background:var(--bg); color:var(--ink); flex:none;}

  /* ============ Compact stop cards + timeline ============ */
  .timeline{position:relative; margin-top:10px; padding-left:22px;}
  .timeline::before{content:''; position:absolute; left:6px; top:8px; bottom:14px; width:2px; border-radius:2px; background:var(--line);}
  .timeline.plain{padding-left:0;}
  .timeline.plain::before{display:none;}
  .tl-period{
    position:relative; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft);
    margin:14px 0 6px;
  }
  .tl-period:first-child{margin-top:0;}
  .tl-period.am{color:var(--rose-deep);} .tl-period.pm{color:var(--teal-deep);}
  .timeline:not(.plain) .tl-period::before{
    content:''; position:absolute; left:-22px; top:50%; width:14px; height:2px; background:var(--bg); 
  }
  .stop-wrap{position:relative; margin-top:8px;}
  .stop-card.compact{position:relative;}
  .timeline:not(.plain) .stop-card.compact::before{
    content:''; position:absolute; left:-22px; top:50%; margin-top:-6px; width:12px; height:12px; border-radius:50%;
    background:var(--teal); border:2.5px solid var(--bg); box-sizing:border-box;
  }
  .timeline .stop-card.compact.am::before{background:var(--rose);}
  .timeline .stop-card.compact.travel::before{background:var(--ink);}
  .stop-card.compact{
    display:flex; align-items:center; gap:4px; margin-top:0; padding:6px 10px 6px 2px;
    background:var(--paper); border-radius:var(--radius-lg); border-left:none;
  }
  .stop-card.compact.custom{box-shadow:inset 3px 0 0 var(--amber);}
  .stop-card.compact .stop-drag{margin-left:0; width:30px; height:44px;}
  .stop-main{
    flex:1; min-width:0; text-align:left; border:none; background:none; cursor:pointer; color:var(--ink);
    padding:6px 4px; min-height:var(--tap); display:flex; flex-direction:column; justify-content:center; gap:2px;
  }
  .stop-title{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .stop-card.compact .stop-name{font-size:17px; font-weight:600; letter-spacing:-0.022em; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stop-time-label{flex:none; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--teal-deep);}
  .stop-desc{font-size:14px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stop-warn{display:flex; align-items:flex-start; gap:5px; font-size:13px; color:var(--rose-deep); line-height:1.3;}
  .stop-warn svg{flex:none; width:14px; height:14px; margin-top:1px;}
  .nav-link.round{width:40px; height:40px; min-height:40px; padding:0; justify-content:center; flex:none; border-radius:50%;}
  .nav-link.round svg{width:17px; height:17px;}
  .leg{padding:0 0 8px 2px; font-size:13px; color:var(--ink-soft); display:block;}
  .timeline > .leg{padding:8px 0 0 2px;}
  .leg:empty{display:none;}
  .stop-wrap.dragging .stop-card{box-shadow:0 10px 28px rgba(35,44,36,0.22);}
  .sheet-body .stop-links{margin:0 0 18px;}
  select.field-input{background-image:none;}

  /* ============================================================
     DESIGN PASS — two surface levels, sentence-case labels,
     colour by role (teal = actions, rose = warnings and debts,
     amber = secondary stops, ink = structure), drawn icons.
     ============================================================ */
  :root{
    --bg:#F1F3EC; --bg-deep:#E7EADF; --paper:#FCFCF9; --fill:#E9ECE2;
    --line:rgba(35,44,36,0.10); --radius:12px; --radius-lg:18px;
  }
  body{background:#D9DDD1;}
  .ic{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px;}

  /* ---------- type ---------- */
  .stops-group-label, .extra-label, .home-label{
    font-size:17px; font-weight:700; letter-spacing:-0.02em; text-transform:none; color:var(--ink); margin:0 4px 10px;
  }
  .stops-group-label.second, .home-label.second{margin-top:28px;}
  .home-label{margin-bottom:-2px;}
  .field-label{text-transform:none; letter-spacing:0; font-size:14px; font-weight:600; color:var(--ink-soft);}
  .day-date{text-transform:none; letter-spacing:0; font-size:15px; margin:-6px 4px 22px;}
  .cost-list-total{text-transform:none; letter-spacing:0; font-size:14px;}
  .section-lede{font-size:14px;}
  .day-title-input{font-size:30px; font-weight:800; letter-spacing:-0.034em;}
  .cost-item-amount, .cost-total-row span:last-child, .cat-head span:last-child, .stop-time-label, .leg, .leg-total,
  .reach li span:last-child, .today-time, .confirm-meta{font-variant-numeric:tabular-nums;}

  /* ---------- home ---------- */
  #viewHome .appbar{background:var(--bg); border-bottom:none; -webkit-backdrop-filter:none; backdrop-filter:none; padding-bottom:6px;}
  #viewHome .appbar .title{font-size:32px; font-weight:800; letter-spacing:-0.036em;}
  #viewHome .appbar .subtitle{font-size:14px; letter-spacing:0;}
  .appbar .mark{border-radius:12px; color:var(--paper);}
  .appbar .mark svg{width:22px; height:22px;}
  .trip-card.hero-card{
    position:relative; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start;
    height:188px; padding:14px 16px 16px; border-radius:22px; color:#fff; overflow:hidden;
    background-size:cover; background-position:center; text-align:left;
  }
  .trip-card.hero-card > svg{position:absolute; inset:auto 0 0 0; width:100%; height:70%;}
  .trip-card.hero-card::after{
    content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(35,44,36,0.05) 30%, rgba(35,44,36,0.62) 100%);
  }
  .trip-status{
    position:relative; z-index:1; font-size:13px; font-weight:600; color:var(--ink); background:rgba(252,252,249,0.92);
    border-radius:100px; padding:5px 11px;
  }
  .trip-status.now{background:var(--ink); color:var(--paper);}
  .trip-card-text{position:relative; z-index:1; display:block; min-width:0; max-width:100%;}
  .hero-card .trip-card-name{display:block; font-size:28px; font-weight:800; letter-spacing:-0.034em; line-height:1.1;}
  .hero-card .trip-card-meta{display:block; font-size:14px; color:rgba(255,255,255,0.88); margin-top:4px;}
  .trip-card.hero-card:active{opacity:1; transform:scale(0.985);}
  .trip-card{transition:transform .14s ease;}
  .trip-thumb{border-radius:12px; opacity:1;}
  .home-empty{border-radius:var(--radius-lg);}

  /* ---------- trip cover header ---------- */
  .hero{
    position:relative; flex:none; overflow:hidden; color:#fff; z-index:20;
    height:calc(150px + var(--safe-t)); transition:height .24s cubic-bezier(.2,.7,.2,1);
    background-size:cover; background-position:center;
  }
  .hero::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(35,44,36,0.22) 0%, rgba(35,44,36,0.10) 40%, rgba(35,44,36,0.58) 100%); transition:background .24s ease;}
  .hero-art{position:absolute; inset:auto 0 0 0; height:75%;}
  .hero-art svg{width:100%; height:100%; display:block;}
  .hero-bar{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
    padding:calc(6px + var(--safe-t)) 10px 0 6px;
  }
  .hero .back-btn{margin:0; width:var(--tap); height:var(--tap); color:#fff; padding:0; display:flex; align-items:center; justify-content:center;}
  .hero .back-btn svg{width:26px; height:26px;}
  .hero .appbar-action{color:#fff; font-weight:600; padding:0 10px;}
  .hero-text{
    position:absolute; z-index:1; left:20px; right:20px; bottom:16px; min-width:0;
    transition:left .24s cubic-bezier(.2,.7,.2,1), right .24s cubic-bezier(.2,.7,.2,1), bottom .24s cubic-bezier(.2,.7,.2,1);
  }
  .hero .title{
    font-size:32px; font-weight:800; letter-spacing:-0.036em; line-height:1.1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:font-size .24s cubic-bezier(.2,.7,.2,1);
  }
  .hero .subtitle{font-size:14px; color:rgba(255,255,255,0.88); margin-top:3px; transition:font-size .24s ease, margin .24s ease;}
  .hero.collapsed{height:calc(56px + var(--safe-t));}
  .hero.collapsed::after{background:rgba(35,44,36,0.40);}
  .hero.collapsed .hero-text{left:54px; right:86px; bottom:8px;}
  .hero.collapsed .title{font-size:18px;}
  .hero.collapsed .subtitle{font-size:12px; margin-top:0;}
  .hero.collapsed .hero-art{opacity:0.5;}
  .screen{padding-top:20px;}

  /* ---------- roteiro ---------- */
  .day-selector{padding-bottom:16px;}
  .day-chip{background:transparent; color:var(--ink-soft); box-shadow:inset 0 0 0 1px var(--line); font-weight:600;}
  .day-chip.active{box-shadow:none;}
  .day-base-pill{background:none; padding:0; font-size:13px; font-weight:500;}
  .day-title-row{margin-bottom:8px;}
  @keyframes daySwap{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .day-panel.swap{animation:daySwap .2s ease;}
  .tl-period, .tl-period.am, .tl-period.pm{text-transform:none; letter-spacing:0; font-size:14px; font-weight:600; color:var(--ink-soft);}
  .timeline .stop-card.compact::before, .timeline .stop-card.compact.am::before, .timeline .stop-card.compact.travel::before{background:var(--ink);}
  .stop-card.compact{padding:8px 12px 8px 4px;}
  .stop-card.compact.custom{box-shadow:none;}
  .stop-card.compact.custom .stop-name::after{
    content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--amber); margin-left:8px; vertical-align:2px;
  }
  .stop-time-label{color:var(--ink);}
  .stop-desc{font-size:15px;}
  .leg{font-size:13px;}
  .leg-total{font-weight:500;}
  .arrow-btn{background:none; box-shadow:inset 0 0 0 1px var(--line);}
  .today-card{border-radius:22px; padding:16px 18px;}
  .today-badge{background:var(--paper); color:var(--ink); text-transform:none; letter-spacing:0; font-size:13px;}
  .today-kicker{text-transform:none; letter-spacing:0; font-size:13px;}
  .today-time{color:#fff;}
  .today-go{color:#fff; text-decoration:underline; text-underline-offset:3px;}
  .resv-remove, .attachment-remove, .stop-remove, .person-remove{color:var(--ink-faint);}
  .resv-add-btn, .booking-link-save{border-radius:100px;}
  .resv-add-input{border-radius:100px; padding-left:16px;}

  /* ---------- reservas ---------- */
  .base-card{padding:18px; margin-bottom:14px;}
  .base-card .base-no, .base-card.car .base-no{font-size:14px; font-weight:600; color:var(--ink-soft);}
  .base-card h3{font-size:22px; font-weight:800; letter-spacing:-0.03em;}
  .base-card .nights, .base-card.two .nights{color:var(--ink-soft); font-weight:400;}
  .attachment-icon{color:var(--ink-soft); display:flex;}
  .booking-link-input{background:none; border-radius:0; padding:11px 0; box-shadow:inset 0 -1px 0 var(--line);}
  .booking-link-save{background:none; color:var(--teal); padding:11px 4px;}
  .booking-file-btn{background:none; justify-content:flex-start; gap:8px; color:var(--teal); font-weight:600; margin-top:2px;}
  .booking-file-btn:active{background:none; opacity:0.6;}
  .nav-link.booking-nav{margin-top:14px;}

  /* ---------- despesas ---------- */
  .cost-cat{background:var(--fill); color:var(--ink-soft);}
  .settle-item .cost-cat{background:var(--fill); color:var(--ink);}
  .row-chevron{flex:none; color:var(--ink-faint); font-size:22px; line-height:1;}
  .cost-item-amount{color:var(--ink); font-weight:600;}
  .person-chip.me{background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink);}
  .cost-settle.even{background:var(--fill); color:var(--ink); display:flex; justify-content:flex-start; gap:8px;}
  .settle-btn{background:var(--teal);}
  .cat-bar span{background:var(--ink);}
  .cat-head .ic{margin-right:6px; color:var(--ink-soft);}
  .chip .ic{margin-right:5px; width:16px; height:16px;}
  .whoami-row{background:none; padding:4px; margin-bottom:22px; font-size:15px;}
  .cost-total-row.total{font-size:20px; font-weight:800; letter-spacing:-0.02em;}
  .settle-label{margin-top:24px;}

  /* ---------- notas ---------- */
  .note-card .eyebrow{text-transform:none; letter-spacing:0; font-size:13px; font-weight:600; color:var(--ink-soft);}
  .idea-day-select{background-color:var(--fill);}

  /* ---------- chrome ---------- */
  .tab.active{color:var(--ink);} .tab.active svg{stroke:var(--ink);}
  .tab span{font-size:11px;}
  .loc-google-link{gap:6px;} .loc-google-link::after{content:none;}
  .toast{border-radius:100px; padding:12px 20px;}
  .toast-undo{color:#fff; text-decoration:underline; text-underline-offset:3px;}
  .fab{box-shadow:0 8px 22px rgba(46,110,106,0.38); transition:transform .12s ease;}
  .sheet{border-radius:24px 24px 0 0;}
  .sheet-title{font-weight:700;}
  .sheet-backdrop{animation:fadeIn .18s ease;}
  .legend{font-size:15px;}

  /* ---------- loading ---------- */
  @keyframes skel{0%{opacity:0.55;} 50%{opacity:1;} 100%{opacity:0.55;}}
  .skel{height:64px; border-radius:var(--radius-lg); background:var(--paper); margin-top:10px; animation:skel 1.2s ease-in-out infinite;}
  .skel.tall{height:188px; border-radius:22px; margin-top:0;}
  .skel-list .skel:nth-child(2){animation-delay:.12s;} .skel-list .skel:nth-child(3){animation-delay:.24s;}
  .timeline:not(.plain) .stop-card.compact::before{background:var(--ink);}
  .legend .dot{padding:0; border-top:none; display:block;}

  /* ---------- roteiro: clear sections, plan first ---------- */
  .day-sec{margin-top:0;}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 4px 10px;}
  .sec-head h3{font-size:16px; font-weight:600; letter-spacing:-0.015em; color:var(--ink-soft);}
  .sec-count{font-size:13px; color:var(--ink-faint); font-variant-numeric:tabular-nums; flex:none;}
  /* main space: the plan sits on its own surface, full strength */
  .day-sec.main{background:var(--paper); border-radius:22px; padding:18px 14px 16px; margin:0 -4px;}
  .day-sec.main .sec-head{margin:0 4px 14px;}
  .day-sec.main .sec-head h3{font-size:22px; font-weight:800; letter-spacing:-0.03em; color:var(--ink);}
  .day-sec.main .sec-count{font-size:14px; color:var(--ink-soft);}
  .day-sec.main .stop-card.compact{background:var(--bg);}
  .day-sec.main .timeline:not(.plain) .stop-card.compact::before{border-color:var(--paper);}
  .day-sec.main .stops-group-empty{background:var(--bg); margin-top:0;}
  .day-sec.main .skel{background:var(--bg);}
  .day-sec.main .leg-total{margin:14px 4px 0; padding-top:12px; border-top:1px solid var(--line); color:var(--ink); font-weight:600;}
  /* supporting spaces: separated by a rule, quieter */
  .day-sec.secondary, .day-extra .day-sec{margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .day-extra{margin-top:0;}
  .day-sec.secondary .stop-card.compact{background:none; box-shadow:inset 0 0 0 1px var(--line);}
  .day-sec.secondary .timeline{margin-top:0;}
  .day-sec.secondary .stop-wrap:first-of-type{margin-top:0;}
  .day-sec.secondary .stop-card.compact .stop-name{font-size:16px;}
  .day-sec.secondary .nav-link.round{background:none; color:var(--teal); box-shadow:inset 0 0 0 1px var(--line);}

  /* ---------- day navigation: swipe + dots ---------- */
  .day-chip{position:relative;}
  .day-chip.has-stops::after{
    content:''; position:absolute; left:50%; bottom:5px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--ink-faint);
  }
  .day-chip.active.has-stops::after{background:var(--bg);}
  .day-chip{padding-bottom:11px; padding-top:7px;}
  @keyframes dayNext{from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:none;}}
  @keyframes dayPrev{from{opacity:0; transform:translateX(-28px);} to{opacity:1; transform:none;}}
  @keyframes edgeNext{50%{transform:translateX(-14px);} 100%{transform:none;}}
  @keyframes edgePrev{50%{transform:translateX(14px);} 100%{transform:none;}}
  .day-panel.swap-next{animation:dayNext .22s cubic-bezier(.2,.7,.2,1);}
  .day-panel.swap-prev{animation:dayPrev .22s cubic-bezier(.2,.7,.2,1);}
  #screen-roteiro{overflow-x:hidden;}

  /* swipe between days: horizontal gestures belong to the app, vertical ones to the browser's scroll */
  #dayPanel, #dayPanel *{touch-action:pan-y;}
  #dayPanel .stop-drag{touch-action:none;}
  #screen-roteiro{overscroll-behavior-x:contain;}
  .day-panel.swiping{animation:none; transition:none; will-change:transform; user-select:none; -webkit-user-select:none;}
  .day-panel.settling{transition:transform .2s cubic-bezier(.2,.7,.2,1), opacity .2s ease;}
  #dayPanel .stop-card, #dayPanel .sec-head, #dayPanel .tl-period, #dayPanel .leg{user-select:none; -webkit-user-select:none; -webkit-user-drag:none;}

  /* ============================================================
     ONE KIT FOR THE WHOLE APP
     surface -> white card (title inside) -> rows split by a hairline.
     Every row: round lead, title + sub, trailing value or action.
     Colour: neutral surfaces; teal = actions; rose = warnings, debts.
     ============================================================ */
  :root{
    --bg:#F4F5F2; --bg-deep:#E9EBE6; --paper:#FFFFFF; --fill:#EFF1ED; --strip:#F7F8F5;
    --ink:#1E2420; --ink-soft:#5F6A63; --ink-faint:#9AA39D; --line:rgba(30,36,32,0.09);
    --rose-soft:#F6E4DD; --teal-soft:#E0ECE9;
  }
  body{background:#E2E5DF;}
  .screen{padding:16px 16px calc(96px + var(--safe-b));}
  .tabbar{background:rgba(255,255,255,0.92);}

  .card{background:var(--paper); border-radius:20px; overflow:hidden; margin:0 0 14px;}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:14px 16px 8px;}
  .card-head h3{font-size:16px; font-weight:700; letter-spacing:-0.015em; color:var(--ink); min-width:0;}
  .card-head.main h3, .day-sec.main .card-head h3{font-size:20px; font-weight:800; letter-spacing:-0.03em;}
  .card-head .sec-count{font-size:14px; color:var(--ink-soft); flex:none; font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; margin:0;}
  .total-value{font-size:20px; font-weight:800; letter-spacing:-0.03em; font-variant-numeric:tabular-nums;}
  .row{
    display:flex; align-items:center; gap:12px; padding:12px 14px 12px 16px; min-height:64px;
    border-top:1px solid var(--line); background:none; border-radius:0; margin:0; width:100%; text-align:left; color:var(--ink);
    border-left:none; border-right:none; border-bottom:none; box-shadow:none;
  }
  .card-head + .row, .card-head + * > .row:first-child, .card > .row:first-child{border-top:none;}
  .row-lead{
    flex:none; width:44px; height:44px; border-radius:50%; background:var(--fill); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
  }
  .row-lead.strong{background:var(--ink); color:#fff;}
  .row-lead.debt{background:var(--rose-soft); color:var(--rose-deep);}
  .row-lead .ic{width:20px; height:20px;}
  .row-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .row-title{font-size:17px; font-weight:600; letter-spacing:-0.02em; color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
  .row-sub{font-size:14px; font-weight:400; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis;}
  .row-body{font-size:14px; color:var(--ink-soft); line-height:1.4; margin-top:2px;}
  .row-value{flex:none; font-size:15px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .row-empty{padding:6px 16px 16px; font-size:15px; color:var(--ink-soft); line-height:1.4;}
  .card > .row-empty:first-child{padding-top:16px;}
  .row-chevron{flex:none; color:var(--ink-faint); font-size:22px; line-height:1;}
  .text-btn{flex:none; border:none; background:none; color:var(--teal); font-size:16px; font-weight:600; cursor:pointer; min-height:var(--tap); padding:0 2px;}
  .text-btn:active{opacity:0.6;}

  /* ---------- home ---------- */
  .home-label{font-size:16px; font-weight:700; margin:0 4px -4px;}
  .trip-past-list{margin-top:6px;}
  .trip-card.past{border-bottom:none; border-top:1px solid var(--line); padding:12px 14px 12px 16px;}
  .trip-past-list .card-head + .trip-card.past{border-top:none;}
  .trip-thumb{width:44px; height:44px; border-radius:50%;}
  .trip-status{background:rgba(255,255,255,0.94);}

  /* ---------- roteiro ---------- */
  .day-title-row{margin:0 4px 2px;}
  .day-date{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; margin:0 4px 18px; font-size:15px; color:var(--ink-soft);}
  .day-base-pill{font-size:15px; font-weight:400; color:var(--ink-soft);}
  .day-base-pill::before{content:'Dormida: ';}
  .day-chip{box-shadow:inset 0 0 0 1px var(--line);}
  .day-sec, .day-sec.main, .day-sec.secondary, .day-extra .day-sec{margin:0 0 14px; padding:0; border-top:none; border-radius:20px; background:var(--paper);}
  .day-sec.main .card-head{margin:0; padding:16px 16px 10px;}
  .timeline, .timeline.plain{margin:0; padding:0;}
  .timeline::before{display:none;}
  .stop-wrap{margin:0; position:relative; background:var(--paper);}
  .stop-wrap + .stop-wrap{border-top:1px solid var(--line);}
  .stop-card.row, .day-sec.main .stop-card.row, .day-sec.secondary .stop-card.row{padding:0 14px 0 0; border-top:none; background:none; box-shadow:none; gap:8px;}
  .stop-card.row::before{display:none !important;}
  .stop-main{
    flex:1; min-width:0; display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:12px;
    padding:12px 0 12px 16px; min-height:64px; border:none; background:none; text-align:left; color:var(--ink); cursor:pointer;
    -webkit-touch-callout:none;
  }
  .stop-card.row .stop-name, .day-sec.secondary .stop-card.row .stop-name{font-size:17px; font-weight:600; white-space:nowrap;}
  .stop-card.row.custom .stop-name::after{display:none;}
  .stop-card.row.custom .row-lead{background:var(--amber-soft); color:var(--amber-deep);}
  .stop-desc{white-space:nowrap;}
  .stop-warn{font-size:13px; font-weight:600; color:var(--rose-deep); margin-top:2px;}
  .nav-link.round, .day-sec.secondary .nav-link.round{width:44px; height:44px; min-height:44px; background:var(--teal); color:#fff; box-shadow:none;}
  .leg, .timeline > .leg{display:block; padding:9px 16px; font-size:13px; color:var(--ink-soft); background:var(--strip);}
  .leg:empty{display:none;}
  .leg-total, .day-sec.main .leg-total{margin:0; padding:12px 16px 14px; border-top:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink);}
  .leg-total:empty{display:none;}
  .stop-wrap.dragging{z-index:5; box-shadow:0 12px 30px rgba(30,36,32,0.20); border-radius:16px; border-top-color:transparent;}
  .stop-wrap.dragging .leg{visibility:hidden;}
  .stop-wrap.dragging .stop-card{box-shadow:none;}
  .day-sec.main .skel{background:var(--fill); margin:0 16px 10px;}
  .skel-list{padding-bottom:6px;}

  .resv-list{background:none; border-radius:0;}
  .resv-item{padding:10px 10px 10px 16px; min-height:64px; border-top:1px solid var(--line);}
  .resv-item:first-child{border-top:none;}
  .resv-check{width:44px; height:44px; border-width:2px;}
  .resv-check svg{width:20px; height:20px;}
  .resv-title{font-size:17px; font-weight:600;}
  .resv-item.done .resv-title{font-weight:500;}
  .add-row{min-height:56px; padding-top:6px; padding-bottom:6px;}
  .resv-add-input{background:none; border-radius:0; padding:0; min-height:44px;}
  .notes-input{background:none; border-radius:0; padding:4px 16px 16px; display:block;}

  .today-card{background:var(--paper); color:var(--ink); border-radius:20px; padding:0; margin-bottom:14px;}
  .today-card .card-head{align-items:center;}
  .today-card .card-head h3{font-size:16px;}
  .today-card .card-head .sec-count{flex:1; min-width:0; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .today-card .nav-link{background:var(--teal); color:#fff; flex:none;}
  .today-card .stop-warn{color:var(--rose-deep);}

  /* ---------- reservas ---------- */
  .base-card{padding:0 0 4px; margin-bottom:14px;}
  .base-card .card-head{align-items:center; padding-bottom:0;}
  .base-card .card-head h3{font-size:20px; font-weight:800; letter-spacing:-0.03em;}
  .base-meta{display:flex; flex-wrap:wrap; gap:2px 8px; padding:0 16px 10px; font-size:14px; color:var(--ink-soft);}
  .base-card .base-no, .base-card.car .base-no{font-size:14px; font-weight:400; color:var(--ink-soft);}
  .base-card .nights, .base-card.two .nights{margin:0; font-size:14px; color:var(--ink-soft);}
  .base-meta .nights::before{content:'· ';}
  .base-card p{margin:0; padding:0 16px 12px; font-size:15px;}
  .reach{margin:0;}
  .reach li, .reach li:first-child{padding:12px 16px; border-top:1px solid var(--line); font-size:16px;}
  .nav-link.booking-nav{margin:6px 16px 14px;}
  .booking-link{margin:0; padding:0; border-top:1px solid var(--line);}
  .attachment-list{margin:0;}
  .attachment-item.row{min-height:56px; padding:8px 8px 8px 16px;}
  .attachment-item.row:first-child{border-top:none;}
  .attachment-link{gap:12px;}
  .attachment-link .attachment-icon{width:36px; height:36px; border-radius:50%; background:var(--fill); color:var(--ink); align-items:center; justify-content:center;}
  .attachment-list:not(:empty) + .booking-link-edit-row{border-top:1px solid var(--line);}
  .booking-link-edit-row{padding:4px 14px 4px 16px;}
  .booking-link-input{box-shadow:none; padding:0;}
  .booking-link-save{font-weight:600;}
  .booking-file-btn{margin:0; padding:0 16px; min-height:52px; border-top:1px solid var(--line); border-radius:0;}

  /* ---------- mapa ---------- */
  #map{border-radius:20px; margin-bottom:14px;}
  .legend{background:none; border-radius:0; padding:0 16px 4px;}

  /* ---------- despesas ---------- */
  .cost-tabs{margin-bottom:14px; border-radius:100px; padding:3px; background:var(--bg-deep);}
  .cost-tabs button{border-radius:100px; min-height:40px;}
  .cost-list{background:none; border-radius:0;}
  .cost-item.row{cursor:pointer;}
  .cost-item.row:first-child{border-top:none;}
  .settle-item.row{cursor:default;}
  .cost-cat.row-lead{background:var(--fill); color:var(--ink);}
  .cost-item-desc{font-size:17px; font-weight:600; letter-spacing:-0.02em;}
  .cost-item-who{font-size:14px;}
  .cost-summary{margin:0;}
  .cost-total-row.row, .cost-total-row.row:first-child, .cost-total-row.row:last-of-type{border-radius:0; background:none; font-size:17px;}
  .cost-settle.row, .cost-settle.even.row{margin:0; background:none; color:var(--ink); border-radius:0; font-size:17px; font-weight:400;}
  .cost-settle .row-title{font-weight:500; white-space:normal;}
  .cost-settle .row-title strong{color:var(--rose-deep); font-weight:700;}
  .settle-btn{background:var(--teal); min-height:40px;}
  .settle-list{margin:0;}
  .cat-list{background:none; border-radius:0; margin:0; padding:0 16px 6px;}
  .cat-bar{background:var(--fill);} .cat-bar span{background:var(--ink);}
  .people-list{margin:0; padding:2px 16px 12px;}
  .person-chip{background:var(--fill);}
  .person-chip.me{background:var(--fill); box-shadow:inset 0 0 0 1.5px var(--ink);}
  .person-chip.add{background:none; box-shadow:inset 0 0 0 1px var(--line);}
  .whoami-row.row{margin:0; padding:10px 14px 10px 16px; min-height:56px;}

  /* ---------- notas ---------- */
  #ideasList{margin:0;}
  .idea-item.row{align-items:flex-start;}
  .idea-item.row:first-child, .note-card.row:first-child{border-top:none;}
  .idea-item .row-lead{margin-top:2px;}
  .idea-day-select{
    -webkit-appearance:none; appearance:none; align-self:flex-start; margin-top:8px; min-height:36px; border:none; border-radius:100px;
    padding:0 14px; font-size:14px; font-weight:600; color:var(--teal); background:var(--fill); font-family:inherit; max-width:100%;
  }
  .note-card.row{cursor:pointer; align-items:flex-start; padding-bottom:14px; font-family:inherit;}
  .note-card .row-lead{margin-top:2px;}
  .note-card .row-chevron{margin-top:12px;}
  .note-card .eyebrow{font-size:13px; font-weight:600; color:var(--ink-soft);}

  /* ---------- sheets ---------- */
  .sheet{background:var(--bg);}
  .field-input, .choice-btn, .confirm-card, .place-list, .danger-btn{background:var(--paper);}
  .chip{background:var(--paper);}
  .segmented{background:var(--bg-deep);}

  /* ============ BREATHING ROOM ============ */
  .screen{padding:24px 20px calc(120px + var(--safe-b));}
  .home-scroll{padding:20px 20px calc(120px + var(--safe-b));}
  .card{margin-bottom:24px; border-radius:24px;}
  .card-head{padding:22px 20px 12px;}
  .card-head.main, .day-sec.main .card-head{padding:24px 20px 14px;}
  .card-head h3{font-size:17px;}
  .card-head.main h3, .day-sec.main .card-head h3{font-size:22px;}
  .row{padding:16px 18px 16px 20px; min-height:80px; gap:14px;}
  .row-lead{width:48px; height:48px;}
  .row-text{gap:3px;}
  .row-sub{font-size:15px;}
  .row-empty{padding:4px 20px 24px; font-size:16px; line-height:1.5;}
  .card > .row-empty:first-child{padding-top:24px;}

  /* home */
  .trip-list{gap:20px; margin-bottom:24px;}
  .home-label{margin:8px 4px 0;}
  .trip-card.hero-card{height:208px; padding:18px 20px 20px; border-radius:26px;}
  .trip-card.past{padding:16px 18px 16px 20px;}
  .trip-thumb{width:48px; height:48px;}
  #viewHome .appbar{padding-top:calc(18px + var(--safe-t)); padding-bottom:10px;}

  /* roteiro */
  .day-selector{padding:0 0 24px; margin-bottom:0; gap:10px;}
  .day-chip{min-height:44px; padding:8px 18px 12px;}
  .day-title-row{margin:0 4px 6px;}
  .day-date{margin:0 4px 28px; line-height:1.5;}
  .day-sec, .day-sec.main, .day-sec.secondary, .day-extra .day-sec{margin:0 0 24px; border-radius:24px;}
  .day-sec.main .card-head{padding:24px 20px 14px;}
  .stop-card.row, .day-sec.main .stop-card.row, .day-sec.secondary .stop-card.row{padding:0 18px 0 0; gap:10px;}
  .stop-main{padding:18px 0 18px 20px; min-height:84px; gap:14px;}
  .stop-warn{margin-top:4px;}
  .nav-link.round, .day-sec.secondary .nav-link.round{width:46px; height:46px;}
  .leg, .timeline > .leg{padding:12px 20px;}
  .leg-total, .day-sec.main .leg-total{padding:18px 20px 20px;}
  .resv-item{padding:14px 14px 14px 20px; min-height:76px; gap:14px;}
  .add-row{min-height:68px; padding-top:10px; padding-bottom:10px;}
  .notes-input{padding:4px 20px 24px; min-height:72px; line-height:1.5;}
  .today-card{margin-bottom:24px; border-radius:24px;}

  /* reservas */
  .base-card{padding-bottom:6px; margin-bottom:24px;}
  .base-card .card-head{padding:24px 20px 2px;}
  .base-card .card-head h3{font-size:22px;}
  .base-meta{padding:0 20px 16px; font-size:15px;}
  .base-card .nights, .base-card .base-no, .base-card.car .base-no{font-size:15px;}
  .base-card p{padding:0 20px 18px; font-size:16px; line-height:1.5;}
  .reach li, .reach li:first-child{padding:16px 20px;}
  .nav-link.booking-nav{margin:14px 20px 22px; min-height:44px; padding:0 18px;}
  .attachment-item.row{min-height:68px; padding:12px 12px 12px 20px;}
  .attachment-link .attachment-icon{width:40px; height:40px;}
  .booking-link-edit-row{padding:10px 18px 10px 20px;}
  .booking-file-btn{padding:0 20px; min-height:64px;}

  /* mapa */
  #map{border-radius:24px; margin-bottom:24px; height:56vh;}
  .legend{padding:0 20px 10px;}
  .legend span{padding:16px 0;}

  /* despesas */
  .cost-tabs{margin-bottom:24px; padding:4px;}
  .cost-tabs button{min-height:44px;}
  .total-value{font-size:22px;}
  .cost-item-who{font-size:15px; line-height:1.4; margin-top:2px;}
  .cat-list{padding:0 20px 14px;}
  .cat-row{padding:16px 0;}
  .cat-bar{margin-top:10px;}
  .people-list{padding:4px 20px 20px; gap:10px;}
  .person-chip{min-height:40px; padding:0 16px;}
  .whoami-row.row{padding:16px 18px 16px 20px; min-height:76px;}
  .settle-btn{min-height:44px; padding:0 18px;}

  /* notas */
  .idea-day-select{margin-top:12px; min-height:40px; padding:0 16px;}
  .note-card.row{padding-bottom:20px;}
  .row-body{margin-top:6px; font-size:15px; line-height:1.5;}

  /* trip header + chrome */
  .hero{height:calc(168px + var(--safe-t));}
  .hero-text{left:24px; right:24px; bottom:22px;}
  .hero .subtitle{margin-top:5px;}
  .hero.collapsed{height:calc(60px + var(--safe-t));}
  .hero.collapsed .hero-text{bottom:10px;}
  .tabbar{padding:10px 4px calc(10px + var(--safe-b));}
  .fab{right:20px; bottom:calc(28px + var(--safe-b));}
  .fab.in-trip{bottom:calc(92px + var(--safe-b));}
  .toast{bottom:calc(164px + var(--safe-b));}

  /* sheets */
  .sheet-bar{padding:12px 18px;}
  .sheet-body{padding:26px 20px calc(36px + var(--safe-b));}
  .field{margin-bottom:24px;}
  .field-label{margin:0 4px 10px;}
  .field-input{min-height:52px; padding:14px 16px; border-radius:14px;}
  textarea.field-input{min-height:112px; line-height:1.5;}
  .field-hint{margin-top:10px; line-height:1.45;}
  .field-row{gap:14px;}
  .chips{gap:10px;}
  .chip{min-height:44px; padding:0 16px;}
  .segmented button{min-height:44px;}
  .swatches{gap:16px;}
  .cover-photo-btn{margin-top:18px; min-height:52px; border-radius:14px;}
  .danger-btn{min-height:52px; margin-top:14px;}
  .confirm-card{padding:22px 20px; margin-bottom:24px; border-radius:24px;}
  .place-result{padding:16px 18px;}
  .choice-btn{padding:20px; margin-bottom:14px; border-radius:20px;}
  .sheet-body .stop-links{margin:0 0 26px;}

  /* ---------- period sub-sections inside the plan ---------- */
  .tl-period, .tl-period.am, .tl-period.pm, .tl-period.travel{
    display:flex; align-items:center; gap:10px; margin:0; padding:22px 20px 10px;
    font-size:16px; font-weight:700; letter-spacing:-0.015em; color:var(--ink); text-transform:none;
    border-top:1px solid var(--line);
  }
  .tl-period::before{display:none !important;}
  .timeline > .tl-period:first-child{border-top:none; padding-top:6px;}
  .tl-period .ic{width:22px; height:22px; color:var(--amber);}
  .tl-period.pm .ic{color:var(--amber-deep);}
  .tl-period.travel .ic{color:var(--ink-soft);}
  .tl-period + .stop-wrap{border-top:none;}
  .timeline > .leg{border-top:1px solid var(--line);}
  .day-sec.secondary .timeline > .tl-period:first-child{padding-top:2px;}
  .row-lead{font-size:15px;}
  .row-lead.strong{font-size:13px;}

  /* ---------- navigate arrow without a circle; visible grip to reorder ---------- */
  .nav-link.round, .day-sec.secondary .nav-link.round{
    width:44px; height:44px; min-height:44px; background:none; color:var(--teal); box-shadow:none; border-radius:12px;
  }
  .nav-link.round svg{width:22px; height:22px;}
  .nav-link.round:active{background:var(--fill); opacity:1;}
  .stop-card.row, .day-sec.main .stop-card.row, .day-sec.secondary .stop-card.row{padding-right:8px; gap:0;}
  .stop-card.row .stop-drag{
    flex:none; width:36px; height:56px; margin:0; border:none; background:none; color:var(--ink-faint); cursor:grab;
    display:flex; align-items:center; justify-content:center; touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .stop-card.row .stop-drag svg{width:20px; height:20px; pointer-events:none;}
  .stop-card.row .stop-drag:active{color:var(--ink); cursor:grabbing;}
  .stop-wrap.dragging .stop-drag{color:var(--ink);}
  /* smaller lead on stops */
  .stop-main .row-lead, .today-card .row-lead{width:34px; height:34px; font-size:14px;}
  .stop-main .row-lead.strong, .today-card .row-lead.strong{width:42px; height:26px; border-radius:100px; font-size:12px;}
  .stop-main .row-lead:not(.strong){margin:0 4px;}
  .today-card .row-lead:not(.strong){margin:0 4px;}
  .stop-main .row-lead .ic, .today-card .row-lead .ic{width:17px; height:17px;}
  .stop-main{min-height:72px; padding-top:16px; padding-bottom:16px;}

  /* ---------- day bar: sliding pill, smooth scroll, no dots ---------- */
  .day-selector{position:relative; scroll-snap-type:none; scroll-behavior:smooth; gap:8px; padding:0 2px 24px; margin:0 -2px;
    -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent);}
  .day-ind{
    position:absolute; left:0; top:0; z-index:0; border-radius:100px; background:var(--ink); pointer-events:none;
    transition:transform .32s cubic-bezier(.3,.8,.25,1), width .32s cubic-bezier(.3,.8,.25,1);
  }
  .day-ind.still{transition:none;}
  .day-chip{position:relative; z-index:1; padding:8px 18px; min-height:44px; background:none; transition:color .24s ease, box-shadow .24s ease; scroll-snap-align:none;}
  .day-chip.active{background:none; color:#fff; box-shadow:inset 0 0 0 1px transparent;}
  .day-chip::after, .day-chip.has-stops::after{display:none;}

  /* ---------- driving time: a small pill centred on the divider ---------- */
  .day-sec.main .timeline .stop-wrap + .stop-wrap{border-top:1px solid #E8EAE6;}
  .leg, .timeline > .leg{
    display:block; position:relative; height:1px; padding:0; margin:-1px 0 0; background:#E8EAE6; font-size:13px; border-top:none;
  }
  .tl-period + .stop-wrap > .leg{margin-top:12px;}
  .leg:empty{display:block;}
  .leg-text{
    position:absolute; left:50%; top:0; transform:translate(-50%,-50%); z-index:1; white-space:nowrap; max-width:calc(100% - 32px);
    overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:6px; background:var(--fill); color:#4F5A53; border-radius:100px; padding:5px 12px;
    box-shadow:0 0 0 4px var(--paper); font-variant-numeric:tabular-nums;
  }
  .leg-text .ic{width:15px; height:15px; flex:none;}
  .day-sec.main .stop-main{padding-top:24px; padding-bottom:22px;}
  .timeline > .leg:last-child{margin-bottom:34px;}
  .day-sec.main .tl-period{border-top:none; padding-top:26px;}
  .day-sec.main .timeline > .tl-period:first-child{padding-top:6px;}
  .day-sec.main .card-head .sec-count{text-align:right;}
  .day-sec.main .card-head{flex-direction:column; align-items:flex-start; gap:4px;}
  .day-sec.main .card-head .sec-count{text-align:left; font-size:15px;}
  .day-sec.main .stop-main{padding-top:30px; padding-bottom:28px;}
  .tl-period + .stop-wrap > .leg{margin-top:16px;}
  .timeline > .leg:last-child{margin-bottom:44px;}
  /* checklist circle matches the stop marker (34px), with a 46px touch area */
  .resv-check{width:34px; height:34px; margin:0 4px; position:relative; border-width:1.5px;}
  .resv-check::after{content:''; position:absolute; inset:-7px;}
  .resv-check svg{width:16px; height:16px;}
  .resv-item{min-height:68px;}

  .field-error .error-discard{display:block; margin-top:8px; min-height:36px; color:var(--rose-deep); text-decoration:underline; text-underline-offset:3px; font-size:15px;}

  /* ---------- pagamentos: what each expense means for me ---------- */
  .cost-mine{display:flex; flex-wrap:wrap; gap:6px 18px; padding:0 20px 16px; font-size:15px; color:var(--ink-soft);}
  .cost-mine strong{font-weight:700; font-variant-numeric:tabular-nums;}
  .mine-plus strong{color:var(--teal);} .mine-minus strong{color:var(--rose-deep);}
  .cost-filters{padding:0 20px 18px; gap:8px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .cost-filters::-webkit-scrollbar{display:none;}
  .cost-filters .chip{flex:none; min-height:40px; padding:0 14px; background:var(--fill); font-size:14px; white-space:nowrap;}
  .cost-filters .chip.selected{background:var(--ink); color:#fff;}
  .cost-filters .chip:disabled{opacity:0.45; cursor:default;}
  .chip-n{opacity:0.7; font-weight:500; margin-left:2px; font-variant-numeric:tabular-nums;}
  .cost-filters + .row-empty + .cost-list .cost-item.row:first-child{border-top:1px solid var(--line);}
  .cost-effect{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:1px; min-width:76px;}
  .cost-effect .cost-item-amount{font-size:17px; font-weight:700;}
  .cost-effect small{font-size:12px; color:var(--ink-soft);}
  .cost-effect.paid .cost-item-amount{color:var(--teal);}
  .cost-effect.paid.solo .cost-item-amount{color:var(--ink-soft);}
  .cost-effect.owe .cost-item-amount{color:var(--rose-deep);}
  .cost-effect.out .cost-item-amount{color:var(--ink-faint);}
  .cost-item.is-out .cost-item-main, .cost-item.is-out .cost-cat{opacity:0.5;}
  .cost-cat.row-lead.strong{background:var(--ink); color:#fff;}

  /* ---------- settings entry, currency glyph ---------- */
  .icon-btn{margin-left:auto; flex:none; width:var(--tap); height:var(--tap); border:none; background:none; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:12px;}
  .icon-btn svg{width:24px; height:24px;}
  .icon-btn:active{background:var(--fill);}
  .tab .tab-glyph{display:block; height:25px; line-height:25px; font-size:23px; font-weight:500; letter-spacing:-0.02em;}
  .tab .tab-glyph.long{font-size:14px; font-weight:700;}
  .cur-row{display:flex; align-items:center; gap:14px;}
  .cur-sym{flex:none; width:44px; text-align:center; font-size:17px; font-weight:700;}
  .cur-name{flex:1; min-width:0; font-size:17px; font-weight:500; display:flex; flex-direction:column;}
  .cur-name small{font-size:13px; color:var(--ink-soft); font-weight:400;}
  .cur-check{flex:none; color:var(--teal); visibility:hidden; display:flex;}
  .cur-row.selected .cur-check{visibility:visible;}
  .cur-check .ic{width:22px; height:22px;}

  /* tokens for things that sit on the ink and teal fills */
  :root{--on-ink:#FFFFFF; --on-teal:#FFFFFF; --rule:#E8EAE6; --pill-text:#4F5A53;}
  .day-chip.active, .row-lead.strong, .cost-cat.row-lead.strong, .cost-filters .chip.selected, .trip-status.now{color:var(--on-ink);}
  .leg, .timeline > .leg{background:var(--rule);}
  .day-sec.main .timeline .stop-wrap + .stop-wrap{border-top-color:var(--rule);}
  .leg-text{color:var(--pill-text);}

  /* ============ DARK ============ */
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#121512; --bg-deep:#0B0D0B; --paper:#1C201D; --fill:#2A2F2B; --strip:#222622;
    --ink:#ECEFEA; --ink-soft:#A5AFA8; --ink-faint:#717C75; --line:rgba(236,239,234,0.11);
    --teal:#63BDB5; --teal-deep:#8DD3CC; --teal-soft:#1D3331;
    --rose:#E38D79; --rose-deep:#F2A694; --rose-soft:#3B2520;
    --amber:#E2B95B; --amber-deep:#EDCB7B; --amber-soft:#3A3120;
    --on-ink:#151916; --on-teal:#0E1B1A; --rule:#2C312D; --pill-text:#B4BDB6;
  }
  html[data-theme="dark"] body{background:#050605;}
  html[data-theme="dark"] .tabbar{background:rgba(22,26,23,0.92);}
  html[data-theme="dark"] .fab,
  html[data-theme="dark"] .nav-link:not(.round),
  html[data-theme="dark"] .today-card .nav-link,
  html[data-theme="dark"] .settle-btn,
  html[data-theme="dark"] .chip.selected,
  html[data-theme="dark"] .primary-btn,
  html[data-theme="dark"] .danger-btn.solid,
  html[data-theme="dark"] .resv-item.done .resv-check{color:var(--on-teal);}
  html[data-theme="dark"] .resv-item.done .resv-check svg{stroke:var(--on-teal);}
