  html[data-theme="dark"] .cost-filters .chip.selected{color:var(--on-ink);}
  html[data-theme="dark"] .fab{box-shadow:0 8px 22px rgba(0,0,0,0.5);}
  html[data-theme="dark"] .appbar .mark{color:var(--on-ink);}
  html[data-theme="dark"] .toast{color:var(--on-ink);}
  html[data-theme="dark"] .toast-undo{color:var(--on-ink);}
  html[data-theme="dark"] .trip-status{background:rgba(18,21,18,0.78); color:#fff;}
  html[data-theme="dark"] .trip-status.now{background:#ECEFEA; color:#151916;}
  html[data-theme="dark"] #map{background:#1C201D;}
  html[data-theme="dark"] .sheet-backdrop{background:rgba(0,0,0,0.6);}
  html[data-theme="dark"] .stop-wrap.dragging{box-shadow:0 12px 30px rgba(0,0,0,0.6);}
  html[data-theme="dark"] .segmented button.selected{background:#3A403B; box-shadow:none;}
  html[data-theme="dark"] .day-ind{background:var(--ink);}
  html[data-theme="dark"] .leaflet-container{background:#1C201D;}
  html[data-theme="dark"] .device{box-shadow:0 20px 60px rgba(0,0,0,0.6);}
  html[data-theme="dark"] .swatch.selected{box-shadow:0 0 0 2.5px var(--ink);}
  /* trip covers keep their own colours in both themes */
  .cover-rose{background-color:#B8523E;} .cover-teal{background-color:#2E6E6A;} .cover-amber{background-color:#C99A2E;}
  .cover-ink{background-color:#232C24;} .cover-moss{background-color:#6B7F4F;}
  html[data-theme="dark"] .cover-ink{background-color:#3A443C;}
  .row-button{cursor:pointer; font-family:inherit; border-top:none;}
  .row-button:active{background:var(--fill);}
  .cost-item.is-out .cost-cat{opacity:1;}

  /* filters: all four visible at once */
  .cost-filters{padding:0 16px 18px; gap:6px; flex-wrap:wrap; overflow:visible;}
  .cost-filters .chip{flex:1 1 auto; min-height:38px; padding:0 9px; font-size:13px; text-align:center; letter-spacing:-0.01em;}
  .chip-n{margin-left:1px;}

  /* ---------- map: fills the screen, nothing to scroll, legend as a compact strip ---------- */
  #screen-mapa.active{display:flex; flex-direction:column; overflow:hidden; padding:16px 16px 14px;}
  #map{flex:1 1 auto; height:auto; min-height:0; margin-bottom:12px; border-radius:22px;}
  #screen-mapa .legend{
    flex:none; display:flex; flex-direction:row; flex-wrap:wrap; gap:6px 16px; margin:0; padding:2px 6px 0;
    background:none; border-radius:0; font-size:13px; color:var(--ink-soft);
  }
  #screen-mapa .legend > span{display:flex; align-items:center; padding:0; border-top:none;}
  #screen-mapa .legend .dot{width:9px; height:9px; margin-right:7px;}
  html[data-theme="dark"] .leaflet-bar a{background:#2A2F2B; color:#ECEFEA; border-bottom-color:#3A403B;}
  html[data-theme="dark"] .leaflet-control-attribution{background:rgba(28,32,29,0.8); color:#A5AFA8;}
  html[data-theme="dark"] .leaflet-control-attribution a{color:#8DD3CC;}

  /* OpenStreetMap tiles, toned to the app: quieter in light, inverted in dark */
  .leaflet-tile-pane{filter:saturate(0.55) contrast(0.96) brightness(1.03);}
  html[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(0.45) brightness(0.92) contrast(0.92);}
  .leaflet-control-attribution{font-size:11px;}
  /* Pagamentos / Balanços switch stays pinned while the list scrolls */
  .cost-tabs-bar{position:sticky; top:-48px; z-index:6; background:var(--bg); margin:-24px -20px 14px; padding:36px 20px 10px;}
  .cost-tabs-bar .cost-tabs{margin-bottom:0;}
</style>
</head>
<body>
<div class="device">

  <!-- ============ MENU INICIAL ============ -->
  <div class="view" id="viewHome">
    <header class="appbar">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19 9 8l4 6 3-4 5 9Z"/></svg></div>
      <div>
        <div class="title">Viagens</div>
        <div class="subtitle" id="homeSubtitle">A carregar…</div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Definições"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.5 2.5h4l.5-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4Z"/></svg></button>
    </header>
    <div class="home-scroll">
      <div class="trip-list" id="tripList"><div class="skel tall"></div><div class="skel tall"></div></div>
    </div>
  </div>

  <!-- ============ VIAGEM ============ -->
  <div class="view" id="viewTrip" hidden>
    <header class="hero" id="tripHero">
      <div class="hero-art" id="heroArt"></div>
      <div class="hero-bar">
        <button class="back-btn" id="backBtn" aria-label="Voltar às viagens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="appbar-action" id="editTripBtn">Editar</button>
      </div>
      <div class="hero-text">
        <div class="title" id="tripTitle"></div>
        <div class="subtitle" id="tabSubtitle"></div>
      </div>
    </header>

    <main class="screens">

      <section class="screen active" id="screen-roteiro">
        <section class="card today-card" id="todayCard" hidden></section>
        <div class="day-selector" id="daySelector"></div>
        <article class="day-panel active" id="dayPanel"></article>
      </section>

      <section class="screen" id="screen-reservas">
        <div id="bookingsList"></div>
      </section>

      <section class="screen" id="screen-mapa">
        <div id="map" role="img" aria-label="Mapa do roteiro"></div>
        <div class="legend" id="mapLegend" aria-label="Legenda"></div>
      </section>

      <section class="screen" id="screen-custos">
        <div class="cost-tabs-bar">
        <div class="segmented cost-tabs" id="costTabs" role="tablist">
          <button type="button" class="selected" data-pane="list" role="tab">Pagamentos</button>
          <button type="button" data-pane="balance" role="tab">Balanços</button>
        </div>
        </div>

        <div id="paneCostList">
          <section class="card">
            <div class="card-head main"><h3>Pagamentos</h3><span class="sec-count" id="costListTotal"></span></div>
            <div class="cost-mine" id="costMine" hidden></div>
            <div class="chips cost-filters" id="costFilters" hidden></div>
            <div class="row-empty" id="costListEmpty">Ainda sem despesas. Regista a primeira com o botão «+».</div>
            <div class="cost-list" id="costList"></div>
          </section>
        </div>

        <div id="paneCostBalance" hidden>
          <div class="cost-summary" id="costSummary"></div>
          <div id="settleHistory"></div>
          <div id="costCategories"></div>
          <section class="card">
            <div class="card-head"><h3>Pessoas</h3></div>
            <div class="people-list" id="peopleList"></div>
            <div class="whoami-row row">
              <span class="row-text"><span class="row-sub">Neste telemóvel és</span><strong class="row-title" id="whoamiName">—</strong></span>
              <button class="text-btn" id="whoamiChange">mudar</button>
            </div>
          </section>
          <section class="card">
            <button class="row row-button" id="currencyRow">
              <span class="row-text"><span class="row-sub">Moeda da viagem</span><span class="row-title" id="currencyName">Euro (€)</span></span>
              <span class="row-chevron" aria-hidden="true">›</span>
            </button>
          </section>
        </div>
      </section>

      <section class="screen" id="screen-notas">
        <section class="card">
          <div class="card-head main"><h3>Ideias sem dia</h3><span class="sec-count" id="ideasCount"></span></div>
          <div id="ideasList"></div>
        </section>
        <section class="card">
          <div class="card-head"><h3>Notas gerais</h3><span class="sec-count" id="tipsCount"></span></div>
          <div id="tipsList"></div>
        </section>
      </section>

    </main>

    <nav class="tabbar">
      <button class="tab active" data-target="screen-roteiro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 L9 8 L13 15 L16 10 L21 20 Z"/></svg>
        <span>Roteiro</span>
      </button>
      <button class="tab" data-target="screen-reservas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M6 10V7a2 2 0 0 1 2-2h3v5"/></svg>
        <span>Reservas</span>
      </button>
      <button class="tab" data-target="screen-mapa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span>Mapa</span>
      </button>
      <button class="tab" data-target="screen-custos">
        <span class="tab-glyph" id="tabCurrency" aria-hidden="true">€</span>
        <span>Despesas</span>
      </button>
      <button class="tab" data-target="screen-notas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2Z"/><path d="M8 9h8M8 13h5"/></svg>
        <span>Notas</span>
      </button>
    </nav>

  /* ---------- settings kept on this phone: appearance and currency ---------- */

    var dark = getTheme() === 'dark';

  function headers(extra){

      body: body === undefined ? undefined : JSON.stringify(body)

      if (!r.ok){ var e = new Error(method + ' ' + path + ' → ' + r.status); e.status = r.status; throw e; }

    return fetch(SB_URL + '/storage/v1/object/' + BUCKET + '/' + path, {
      method: 'POST', headers: headers({ 'Content-Type': file.type || 'application/octet-stream' }), body: file

    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);

      url += '&bounded=0&viewbox=' + [near.lng - 2.5, near.lat + 1.6, near.lng + 2.5, near.lat - 1.6].join(',');

  var MO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  function diffDays(a, b){ return Math.round((parseDate(a) - parseDate(b)) / 86400000); }

  function dayDate(t, i){ var d = parseDate(t.start_date); d.setDate(d.getDate() + i); return d; }
  function chipLabel(t, i){ var d = dayDate(t, i); return WD[d.getDay()] + ' ' + d.getDate(); }
  function shortLabel(t, i){ var d = dayDate(t, i); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
  function longLabel(t, i){ var d = dayDate(t, i); return WD_LONG[d.getDay()] + ', ' + d.getDate() + ' de ' + MO_LONG[d.getMonth()]; }

    if (backTimer) return;

  /* ============================================================

  var KIND_LABEL = { lodging: 'Alojamento', transport: 'Transporte', other: 'Reserva' };
  function detailsHtml(text){

        + '</div></div>';
    }).join('');

  function bookingsChanged(){ cacheState(); renderBookings(); renderDay(); if (map) refreshMap(); }
  function findBooking(id){ return S.bookings.filter(function(b){ return b.id === id; })[0]; }

  function openBookingSheet(b){
    var editing = !!b, kind = editing ? b.kind : (lodgings().length ? 'other' : 'lodging');
    var n = tripDays(TRIP), lastNight = Math.max(0, n - 2);
    var first = editing && b.first_night != null ? b.first_night : 0;
    var last = editing && b.last_night != null ? b.last_night : lastNight;
    var html = ''
      + '<div class="field"><span class="field-label">Tipo</span><div class="segmented" id="bKind">'
      +   ['lodging', 'transport', 'other'].map(function(k){
            return '<button type="button" data-kind="' + k + '" class="' + (k === kind ? 'selected' : '') + '">' + (k === 'other' ? 'Outra' : KIND_LABEL[k]) + '</button>';

      + '</div></div>'
      + '<div class="field"><label class="field-label" for="bTitle">Nome</label>'
      +   '<input class="field-input" id="bTitle" type="text" placeholder="Ex.: Hotel, voo, jantar…" value="' + esc(editing ? b.title : '') + '"></div>'
      + '<div id="bNights"><div class="field-row">'
      +   '<div class="field"><label class="field-label" for="bFirst">Primeira noite</label><input class="field-input" id="bFirst" type="date" min="' + TRIP.start_date + '" max="' + TRIP.end_date + '" value="' + isoDate(dayDate(TRIP, first)) + '"></div>'
      +   '<div class="field"><label class="field-label" for="bLast">Última noite</label><input class="field-input" id="bLast" type="date" min="' + TRIP.start_date + '" max="' + TRIP.end_date + '" value="' + isoDate(dayDate(TRIP, last)) + '"></div>'
      + '</div><div class="field-hint" style="margin:-8px 4px 16px;">O alojamento aparece no mapa e é o ponto de partida dos dias seguintes.</div></div>'
      + '<div class="field"><label class="field-label" for="bDetails">Notas</label>'
      +   '<textarea class="field-input" id="bDetails" placeholder="Morada, check-in, contactos…">' + esc(editing ? b.details : '') + '</textarea>'
      +   '<div class="field-hint">Uma linha escrita como «Local — 30 min» aparece em lista, com o tempo à direita.</div></div>'
      + (editing ? '<button type="button" class="danger-btn" id="bDelete">Apagar reserva</button>' : '');
    openSheet({
      title: editing ? 'Editar reserva' : 'Nova reserva', saveLabel: 'Adicionar', autosave: editing, html: html,
      onOpen: function(body){
        function sync(){ body.querySelector('#bNights').hidden = kind !== 'lodging'; }
        sync();
        body.querySelector('#bKind').addEventListener('click', function(e){
          var btn = closest(e, 'button'); if (!btn) return;
          kind = btn.dataset.kind;
          body.querySelectorAll('#bKind button').forEach(function(x){ x.classList.toggle('selected', x === btn); });
          sync();
        });
        var del = body.querySelector('#bDelete');
        if (del) del.addEventListener('click', function(){
          var i = S.bookings.indexOf(b), files = S.attachments.filter(function(a){ return a.base_id === b.id; });
          S.bookings.splice(i, 1);
          S.attachments = S.attachments.filter(function(a){ return a.base_id !== b.id; });
          closeSheet(); bookingsChanged();
          offerUndo('«' + b.title + '» apagada.', function(){
            S.bookings.splice(Math.min(i, S.bookings.length), 0, b); S.attachments = S.attachments.concat(files); bookingsChanged();
          }, function(){
            save('DELETE', TB.attachments + '?base_id=eq.' + encodeURIComponent(b.id));
            save('DELETE', TB.bookings + '?id=eq.' + encodeURIComponent(b.id));
          });
        });
        if (!editing) body.querySelector('#bTitle').focus();
      },
      onSave: function(body){
        var title = body.querySelector('#bTitle').value.trim();
        if (!title){ sheetError('Dá um nome à reserva.'); return false; }
        var f = { kind: kind, title: title, details: body.querySelector('#bDetails').value.trim(), first_night: null, last_night: null };
        if (kind === 'lodging'){
          var a = body.querySelector('#bFirst').value, z = body.querySelector('#bLast').value;
          if (!a || !z){ sheetError('Escolhe a primeira e a última noite.'); return false; }
          if (z < a){ sheetError('A última noite tem de ser igual ou posterior à primeira.'); return false; }
          f.first_night = Math.max(0, Math.min(n - 1, diffDays(a, TRIP.start_date)));
          f.last_night = Math.max(0, Math.min(n - 1, diffDays(z, TRIP.start_date)));
        }
        var trip = TRIP;
        var needsGeo = kind === 'lodging' && (!editing || b.title !== title || b.lat == null);
        var geo = needsGeo ? geocode(title + (trip.destination ? ', ' + trip.destination : ''), trip) : Promise.resolve(undefined);
        return geo.then(function(c){
          if (c !== undefined){ f.lat = c ? c.lat : null; f.lng = c ? c.lng : null; }
          if (kind !== 'lodging'){ f.lat = null; f.lng = null; }
          if (editing){
            for (var k in f) b[k] = f[k];
            save('PATCH', TB.bookings + '?id=eq.' + encodeURIComponent(b.id), f);
          } else {
            var nb = Object.assign({ id: uid(), trip_id: trip.id, lat: null, lng: null }, f);
            S.bookings.push(Object.assign({ created_at: new Date().toISOString() }, nb));
            save('POST', TB.bookings, [nb]);
          }
          if (TRIP === trip) bookingsChanged();
        });
      }
    });
  }

  function addAttachment(bookingId, url, label){

  /* ============================================================
     MAPA
     ============================================================ */
  function dot(color){
    return L.divIcon({ className: '', iconSize: [14, 14], iconAnchor: [7, 7],
      html: '<div style="width:14px;height:14px;border-radius:50%;background:' + color + ';border:2px solid #F8F8F3;box-shadow:0 1px 3px rgba(0,0,0,.35);"></div>' });
  }
  function destroyMap(){
    if (map){ map.remove(); map = null; mapLayers = []; }
    $('map').innerHTML = '';
  }
  function hasCoords(x){ return x.lat != null && x.lng != null; }
  function dayColor(d){
    var from = d > 0 ? lodgingForNight(d - 1) : null, ref = from || lodgingForNight(d);
    return ref ? LODGE_COLORS[ref.index % LODGE_COLORS.length] : LODGE_COLORS[0];
  }
  // What the map frames when it opens: the places of the trip itself. A far-away departure or
  // return point (period "Viagem") stays on the map but does not zoom everything else out.
  function mapPoints(){
    var near = [], far = [];
    S.stops.forEach(function(s){
      if (s.day < 0 || !hasCoords(s)) return;
      (periodOf(s) === 'travel' && !s.is_custom ? far : near).push([s.lat, s.lng]);
    });
    lodgings().filter(hasCoords).forEach(function(b){ near.push([b.lat, b.lng]); });
    return near.length >= 2 ? near : near.concat(far);
  }
  function refreshMap(){
    if (!map) return;
    mapLayers.forEach(function(l){ map.removeLayer(l); });
    mapLayers = [];
    function add(layer){ mapLayers.push(layer.addTo(map)); return layer; }
    var line = { weight: 2.5, opacity: 0.55, dashArray: '1 7' };
    var n = tripDays(TRIP), usedColors = {}, hasTravel = false, hasCustom = false;

    for (var d = 0; d < n; d++){
      var stops = sortStops(S.stops.filter(function(s){ return s.day === d && !s.is_custom; })).filter(hasCoords);
      if (!stops.length) continue;
      var from = d > 0 ? lodgingForNight(d - 1) : null, to = lodgingForNight(d);
      var allTravel = stops.every(function(s){ return s.period === 'travel'; });
      var color = allTravel ? INK : dayColor(d);
      var pts = [];
      if (from && hasCoords(from.booking)) pts.push([from.booking.lat, from.booking.lng]);
      stops.forEach(function(s){ pts.push([s.lat, s.lng]); });
      if (to && hasCoords(to.booking)) pts.push([to.booking.lat, to.booking.lng]);
      if (pts.length > 1) add(L.polyline(pts, Object.assign({ color: color }, line)));
      stops.forEach(function(s){
        var c = s.period === 'travel' ? INK : color;
        if (s.period === 'travel') hasTravel = true; else usedColors[color] = true;
        add(L.marker([s.lat, s.lng], { icon: dot(c) }))
          .bindPopup('<strong>' + esc(s.name) + '</strong><br>' + shortLabel(TRIP, s.day) + ' · ' + (PERIOD[s.period] || ''));
      });
    }
    S.stops.filter(function(s){ return s.is_custom && s.day >= 0 && hasCoords(s); }).forEach(function(s){
      hasCustom = true;
      add(L.marker([s.lat, s.lng], { icon: dot(AMBER) }))
        .bindPopup('<strong>' + esc(s.name) + '</strong><br>' + shortLabel(TRIP, s.day) + ' · secundária');
    });
    var lodge = lodgings();
    lodge.filter(hasCoords).forEach(function(b){
      add(L.marker([b.lat, b.lng], { icon: dot(INK), zIndexOffset: 500 }))
        .bindPopup('<strong>' + esc(b.title) + '</strong><br>' + (b.first_night != null ? nightsLabel(TRIP, b.first_night, b.last_night) : 'Alojamento'));
    });

    var legend = '';
    if (lodge.some(hasCoords) || hasTravel) legend += '<span><span class="dot ink"></span>Alojamento e viagem</span>';
    lodge.forEach(function(b, i){
      var c = LODGE_COLORS[i % LODGE_COLORS.length];
      if (usedColors[c]) legend += '<span><span class="dot" style="background:' + c + '"></span>Dias a partir de ' + esc(shortName(b.title)) + '</span>';
    });
    if (!lodge.length && usedColors[LODGE_COLORS[0]]) legend += '<span><span class="dot rose"></span>Plano do dia</span>';
    if (hasCustom) legend += '<span><span class="dot amber"></span>Paragens secundárias</span>';
    if (!legend) legend = '<span>Ainda sem locais no mapa. Adiciona o alojamento ou paragens ao roteiro.</span>';
    $('mapLegend').innerHTML = legend;
  }
  function initMap(){
    if (!TRIP || typeof L === 'undefined') return;
    try {
      var center = TRIP.lat != null && TRIP.lng != null ? [TRIP.lat, TRIP.lng] : [46.0, 8.0];
      map = L.map('map', { scrollWheelZoom: false }).setView(center, TRIP.lat != null ? 9 : 4);
      // OpenStreetMap's own tiles: no API key. (CARTO's basemaps started requiring one in August 2026.)
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', maxZoom: 19
      }).addTo(map);
      refreshMap();
      var pts = mapPoints();
      if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.12));
      else if (pts.length === 1) map.setView(pts[0], 11);
    } catch (err) {
      map = null;
      $('map').innerHTML = '<div style="padding:16px; font-size:15px; color:#8F3C2C;">Não foi possível carregar o mapa. Verifica a ligação à internet e volta a abrir este separador.</div>';
    }
  }

  /* ============================================================
     CUSTOS
     ============================================================ */
  var CATS = [['lodging', 'Alojamento', ic('bed')], ['transport', 'Transporte', ic('car')], ['food', 'Comida', ic('fork')],
              ['activities', 'Atividades', ic('ticket')], ['shopping', 'Compras', ic('bag')], ['other', 'Outros', ic('dots')]];
  function catOf(c){ for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === c.category) return CATS[i]; return CATS[CATS.length - 1]; }
  function parseAmount(raw){ return parseFloat(String(raw).trim().replace(/\s/g, '').replace(',', '.')); }
  function myName(){ try { return localStorage.getItem('dolomiti_my_name') || ''; } catch (e) { return ''; } }
  function setMyName(v){ try { localStorage.setItem('dolomiti_my_name', v); } catch (e) {} }
  function money(v){ var c = curSymbol(); return c + (c.length > 1 ? ' ' : '') + v.toFixed(2).replace('.', ','); }

  // Everyone in the trip: the saved list plus anyone who already appears in a cost.
  function people(){
    var out = [];
    function add(p){ if (p && out.indexOf(p) < 0) out.push(p); }
    (TRIP && Array.isArray(TRIP.people) ? TRIP.people : []).forEach(add);
    S.costs.forEach(function(c){ add(c.paid_by); (Array.isArray(c.split_with) ? c.split_with : []).forEach(add); });
    S.settlements.forEach(function(x){ add(x.from_person); add(x.to_person); });
    return out;
  }
  function savePeople(list){
    TRIP.people = list; cacheSet('viagens_lista', TRIPS);
    save('PATCH', TB.trips + '?id=eq.' + encodeURIComponent(TRIP.id), { people: list });
  }
  function addPerson(name){
    name = String(name || '').trim(); if (!name || !TRIP) return '';
    var all = people(), same = all.filter(function(p){ return p.toLowerCase() === name.toLowerCase(); })[0];
    if (same) name = same;
    var list = Array.isArray(TRIP.people) ? TRIP.people.slice() : [];
    if (list.indexOf(name) < 0){ list.push(name); savePeople(list); }
    return name;
  }
  function personUsed(p){
    return S.costs.some(function(c){ return c.paid_by === p || (Array.isArray(c.split_with) && c.split_with.indexOf(p) >= 0); })
      || S.settlements.some(function(x){ return x.from_person === p || x.to_person === p; });
  }
  function sharers(c, all){
    var list = Array.isArray(c.split_with) ? c.split_with.filter(Boolean) : [];
    return list.length ? list : all;
  }
  function openNameSheet(next){
    var all = people();
    openSheet({
      title: 'Quem és tu?', saveLabel: 'Guardar',
      html: '<div class="field"><label class="field-label" for="nName">O teu nome</label>'
        + '<input class="field-input" id="nName" type="text" autocomplete="off" placeholder="Ex.: Tiago" value="' + esc(myName()) + '">'
        + '<div class="field-hint">Fica guardado neste telemóvel e serve para saber quem pagou cada despesa.</div></div>'
        + (all.length ? '<div class="field"><span class="field-label">Ou escolhe da lista</span><div class="chips" id="nChips">'
            + all.map(function(p){ return '<button type="button" class="chip" data-p="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div></div>' : ''),
      onOpen: function(body){
        var input = body.querySelector('#nName'), chipsBox = body.querySelector('#nChips');
        if (chipsBox) chipsBox.addEventListener('click', function(e){ var c = closest(e, '.chip'); if (c) input.value = c.dataset.p; });
        input.focus();
      },
      onSave: function(body){
        var v = body.querySelector('#nName').value.trim();
        if (!v){ sheetError('Escreve o teu nome.'); return false; }

      }

  function openPersonSheet(){
    openSheet({
      title: 'Nova pessoa', saveLabel: 'Juntar',
      html: '<div class="field"><label class="field-label" for="pName">Nome</label><input class="field-input" id="pName" type="text" autocomplete="off" placeholder="Ex.: Ana"></div>',
      onOpen: function(body){ body.querySelector('#pName').focus(); },

        var v = body.querySelector('#pName').value.trim();

  function renderPeople(){
    var box = $('peopleList'); if (!box || !TRIP) return;
    var me = myName(), all = people();
    $('whoamiName').textContent = me || '—';
    $('whoamiChange').textContent = me ? 'mudar' : 'Adicionar';
    box.innerHTML = all.map(function(p){
      return '<span class="person-chip' + (p === me ? ' me' : '') + '" data-name="' + esc(p) + '">' + esc(p) + (p === me ? ' (tu)' : '')
        + (personUsed(p) ? '' : '<button class="person-remove" aria-label="Remover ' + esc(p) + '">×</button>') + '</span>';
    }).join('') + '<button class="person-chip add" id="personAddBtn">+ Pessoa</button>';
  }
  $('whoamiChange').addEventListener('click', function(){ openNameSheet(); });
  $('peopleList').addEventListener('click', function(e){
    if (closest(e, '#personAddBtn')){ openPersonSheet(); return; }
    var rm = closest(e, '.person-remove');
    if (rm){
      var name = rm.parentNode.dataset.name;
      savePeople((TRIP.people || []).filter(function(p){ return p !== name; })); costsChanged();
    }
  });

  // What one expense means for the person using this phone.
  var costFilter = 'all';
  function costView(c, all, me){
    var sh = sharers(c, all), share = c.amount / sh.length, paid = c.paid_by === me, inIt = sh.indexOf(me) >= 0;
    if (paid){
      var lent = c.amount - (inIt ? share : 0);
      return lent > 0.005 ? { k: 'paid', value: '+' + money(lent), label: 'emprestaste', lent: lent, owe: 0 }
                          : { k: 'paid', solo: true, value: money(0), label: 'só teu', lent: 0, owe: 0 };
    }
    if (inIt) return { k: 'owe', value: '−' + money(share), label: 'a tua parte', lent: 0, owe: share };
    return { k: 'out', value: '—', label: 'não entras', lent: 0, owe: 0 };
  }
  function renderCostList(){
    var all = people(), me = myName(), personal = !!me && all.indexOf(me) >= 0;
    var sum = S.costs.reduce(function(t, c){ return t + c.amount; }, 0), nC = S.costs.length;
    $('costListTotal').textContent = nC ? nC + (nC === 1 ? ' despesa' : ' despesas') + ' · ' + money(sum) : '';
    $('costListEmpty').hidden = nC > 0 || LOADING; $('costList').hidden = nC === 0;
    var views = S.costs.map(function(c){ return personal ? costView(c, all, me) : null; });
    var count = { all: nC, paid: 0, owe: 0, out: 0 }, lent = 0, owe = 0;
    views.forEach(function(v){ if (v){ count[v.k]++; lent += v.lent; owe += v.owe; } });
    $('costMine').hidden = !(personal && nC);
    $('costMine').innerHTML = personal && nC
      ? '<span class="mine-plus">Emprestaste <strong>' + money(lent) + '</strong></span><span class="mine-minus">Deves <strong>' + money(owe) + '</strong></span>' : '';
    if (!personal || !count[costFilter]) costFilter = 'all';
    $('costFilters').hidden = !(personal && nC);
    $('costFilters').innerHTML = personal && nC ? [['all', 'Todas'], ['paid', 'Paguei'], ['owe', 'Devo'], ['out', 'Não entro']].map(function(f){
      return '<button type="button" class="chip' + (f[0] === costFilter ? ' selected' : '') + '" data-f="' + f[0] + '"' + (count[f[0]] ? '' : ' disabled') + '>' + f[1] + ' <span class="chip-n">' + count[f[0]] + '</span></button>';
    }).join('') : '';
    $('costList').innerHTML = S.costs.map(function(c, i){ return { c: c, v: views[i] }; }).reverse().filter(function(x){
      return costFilter === 'all' || (x.v && x.v.k === costFilter);
    }).map(function(x){
      var c = x.c, v = x.v, cat = catOf(c), sh = sharers(c, all);
      var who, right;
      if (v){
        who = money(c.amount) + ' · ' + (c.paid_by === me ? 'pagaste tu' : 'pago por ' + esc(c.paid_by));
        right = '<span class="cost-effect ' + v.k + (v.solo ? ' solo' : '') + '"><span class="cost-item-amount">' + v.value + '</span><small>' + v.label + '</small></span>';
      } else {
        var split = sh.length === all.length ? (all.length > 1 ? 'dividido por todos' : '') : (sh.length === 1 ? 'só de ' + sh[0] : 'dividido por ' + sh.join(', '));
        who = cat[1] + ' · pago por ' + esc(c.paid_by) + (split ? ' · ' + esc(split) : '');
        right = '<span class="cost-item-amount">' + money(c.amount) + '</span>';
      }
      return '<div class="cost-item row' + (v ? ' is-' + v.k : '') + '" data-id="' + esc(c.id) + '"><span class="cost-cat row-lead" title="' + cat[1] + '">' + cat[2] + '</span><div class="cost-item-main">'
        + '<span class="cost-item-desc">' + esc(c.description) + '</span>'
        + '<span class="cost-item-who">' + who + '</span></div>'
        + right + '<span class="row-chevron" aria-hidden="true">›</span></div>';
    }).join('');
  }
  $('costFilters').addEventListener('click', function(e){
    var b = closest(e, '.chip'); if (!b || b.disabled) return;
    costFilter = b.dataset.f; renderCostList();
  });
  function balances(){
    var all = people(), paid = {}, owed = {};
    all.forEach(function(p){ paid[p] = 0; owed[p] = 0; });
    S.costs.forEach(function(c){
      var sh = sharers(c, all);
      paid[c.paid_by] = (paid[c.paid_by] || 0) + c.amount;
      sh.forEach(function(p){ owed[p] = (owed[p] || 0) + c.amount / sh.length; });
    });
    // Payments already made between people move the balance without changing what each one spent.
    var adj = {};
    all.forEach(function(p){ adj[p] = 0; });
    S.settlements.forEach(function(x){
      adj[x.from_person] = (adj[x.from_person] || 0) + x.amount;
      adj[x.to_person] = (adj[x.to_person] || 0) - x.amount;
    });
    return { people: all, paid: paid, owed: owed, adj: adj };
  }
  // Fewest simple transfers: whoever owes most pays whoever is owed most, until settled.
  function settlements(b){
    var debt = [], cred = [], out = [];
    b.people.forEach(function(p){
      var v = Math.round((b.paid[p] - b.owed[p] + (b.adj[p] || 0)) * 100) / 100;
      if (v > 0.005) cred.push({ p: p, v: v }); else if (v < -0.005) debt.push({ p: p, v: -v });
    });
    debt.sort(function(a, z){ return z.v - a.v; }); cred.sort(function(a, z){ return z.v - a.v; });
    var i = 0, j = 0;
    while (i < debt.length && j < cred.length){
      var x = Math.min(debt[i].v, cred[j].v);
      if (x > 0.005) out.push({ from: debt[i].p, to: cred[j].p, amount: x });
      debt[i].v -= x; cred[j].v -= x;
      if (debt[i].v < 0.005) i++;
      if (cred[j].v < 0.005) j++;
    }
    return out;
  }
  var PENDING = [];
  function renderCostSummary(){
    var box = $('costSummary'), cbox = $('costCategories');
    if (!S.costs.length && !S.settlements.length){
      box.innerHTML = '<section class="card"><div class="row-empty">Ainda sem despesas registadas.</div></section>'; cbox.innerHTML = ''; $('settleHistory').innerHTML = ''; return;
    }
    var b = balances(), total = S.costs.reduce(function(s, c){ return s + c.amount; }, 0);
    var rows = b.people.map(function(p){
      return '<div class="cost-total-row row"><span class="row-lead">' + esc(p.charAt(0).toUpperCase()) + '</span>'
        + '<span class="row-text"><span class="row-title">' + esc(p) + '</span><small class="row-sub">parte: ' + money(b.owed[p] || 0) + '</small></span>'
        + '<span class="row-value">pagou ' + money(b.paid[p] || 0) + '</span></div>';
    }).join('');
    var st = settlements(b), settle = '';
    PENDING = st;
    if (b.people.length > 1){
      settle = '<section class="card"><div class="card-head"><h3>Por regularizar</h3>' + (st.length ? '<span class="sec-count">' + st.length + '</span>' : '') + '</div>' + (st.length ? st.map(function(x, i){
        return '<div class="cost-settle row"><span class="row-lead debt">' + ic('swap') + '</span><span class="row-text"><span class="row-title">' + esc(x.from) + ' deve <strong>' + money(x.amount) + '</strong> a ' + esc(x.to) + '</span></span>'
          + '<button class="settle-btn" data-i="' + i + '">Regularizar</button></div>';
      }).join('') : '<div class="cost-settle even row"><span class="row-lead">' + ic('check') + '</span><span class="row-text"><span class="row-title">Contas equilibradas.</span></span></div>') + '</section>';
    }
    var hist = S.settlements.slice().reverse();
    $('settleHistory').innerHTML = hist.length ? '<section class="card"><div class="card-head"><h3>Pagamentos feitos</h3><span class="sec-count">' + hist.length + '</span></div><div class="settle-list">' + hist.map(function(x){
      var d = parseDate(x.paid_on);
      return '<div class="cost-item settle-item row" data-id="' + esc(x.id) + '"><span class="cost-cat row-lead">' + ic('check') + '</span><div class="cost-item-main">'
        + '<span class="cost-item-desc">' + esc(x.from_person) + ' pagou ' + money(x.amount) + ' a ' + esc(x.to_person) + '</span>'
        + '<span class="cost-item-who">' + d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear() + (x.recorded_by ? ' · registado por ' + esc(x.recorded_by) : '') + '</span></div>'
        + '<button class="text-btn settle-undo">Retirar</button></div>';
    }).join('') + '</div></section>' : '';
    box.innerHTML = '<section class="card"><div class="card-head main"><h3>Total gasto</h3><span class="total-value">' + money(total) + '</span></div>' + rows + '</section>' + settle;

    var byCat = {};
    S.costs.forEach(function(c){ var k = catOf(c)[0]; byCat[k] = (byCat[k] || 0) + c.amount; });
    var used = CATS.filter(function(c){ return byCat[c[0]]; }).sort(function(a, z){ return byCat[z[0]] - byCat[a[0]]; });
    var max = used.length ? byCat[used[0][0]] : 1;
    cbox.innerHTML = '<section class="card"><div class="card-head"><h3>Por categoria</h3></div><div class="cat-list">' + used.map(function(c){
      var v = byCat[c[0]];
      return '<div class="cat-row"><div class="cat-head"><span>' + c[2] + ' ' + c[1] + '</span><span>' + money(v) + ' · ' + Math.round(v / total * 100) + '%</span></div>'
        + '<div class="cat-bar"><span style="width:' + Math.max(2, v / max * 100).toFixed(1) + '%"></span></div></div>';
    }).join('') + '</div></section>';
  }
  function costsChanged(){ cacheState(); renderCurrency(); renderPeople(); renderCostList(); renderCostSummary(); }

  function openCostSheet(c){
    var editing = !!c;
    if (!myName()){ openNameSheet(function(){ openCostSheet(c); }); return; }
    if (people().indexOf(myName()) < 0) addPerson(myName());
    var all = people();
    var cat = editing ? catOf(c)[0] : 'other', payer = editing ? c.paid_by : myName();
    var split = (editing ? sharers(c, all) : all).slice();
    function chips(){
      return '<div class="field"><span class="field-label">Pago por</span><div class="chips" id="kPayer">'
        + all.map(function(p){ return '<button type="button" class="chip' + (p === payer ? ' selected' : '') + '" data-p="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div></div>'
        + '<div class="field"><span class="field-label">Dividir por</span><div class="chips" id="kSplit">'
        + all.map(function(p){ return '<button type="button" class="chip check' + (split.indexOf(p) >= 0 ? ' selected' : '') + '" data-p="' + esc(p) + '">' + esc(p) + '</button>'; }).join('')
        + '<button type="button" class="chip add" id="kAddPerson">+ Pessoa</button></div>'
        + '<div class="inline-add" id="kNewRow" hidden><input class="field-input" id="kNewName" type="text" autocomplete="off" placeholder="Nome da pessoa"><button type="button" class="chip selected" id="kNewAdd">Juntar</button></div>'
        + '<div class="field-hint" id="kShare"></div></div>';
    }
    openSheet({
      title: editing ? 'Editar despesa' : 'Nova despesa', saveLabel: 'Adicionar', autosave: editing,
      html: '<div class="field"><label class="field-label" for="kDesc">Descrição</label><input class="field-input" id="kDesc" type="text" placeholder="Ex.: jantar, gasolina" value="' + esc(editing ? c.description : '') + '"></div>'
        + '<div class="field"><label class="field-label" for="kAmount">Valor (' + esc(curSymbol()) + ')</label><input class="field-input" id="kAmount" type="text" inputmode="decimal" placeholder="Ex.: 12,50" value="' + (editing ? c.amount.toFixed(2).replace('.', ',') : '') + '"></div>'
        + '<div class="field"><span class="field-label">Categoria</span><div class="chips" id="kCat">'
        + CATS.map(function(x){ return '<button type="button" class="chip' + (x[0] === cat ? ' selected' : '') + '" data-c="' + x[0] + '">' + x[2] + ' ' + x[1] + '</button>'; }).join('') + '</div></div>'
        + '<div id="kPeople">' + chips() + '</div>'
        + (editing ? '<button type="button" class="danger-btn" id="kDelete">Apagar despesa</button>' : ''),
      onOpen: function(body){
        function share(){
          var v = parseAmount(body.querySelector('#kAmount').value), el = body.querySelector('#kShare');
          el.textContent = !split.length ? 'Escolhe pelo menos uma pessoa.' : (isNaN(v) || v <= 0 ? '' : (split.length === 1 ? 'Fica tudo por conta de ' + split[0] + '.' : money(v / split.length) + ' a cada um.'));
        }
        share();
        body.querySelector('#kAmount').addEventListener('input', share);
        body.querySelector('#kCat').addEventListener('click', function(e){
          var btn = closest(e, '.chip'); if (!btn) return;
          cat = btn.dataset.c;
          body.querySelectorAll('#kCat .chip').forEach(function(x){ x.classList.toggle('selected', x === btn); });
        });
        body.querySelector('#kPeople').addEventListener('click', function(e){
          var btn = closest(e, '.chip'); if (!btn) return;
          if (btn.id === 'kAddPerson'){
            body.querySelector('#kNewRow').hidden = false; body.querySelector('#kNewName').focus();
            return;
          }
          if (btn.id === 'kNewAdd'){
            var v = addPerson(body.querySelector('#kNewName').value);
            if (v){ all = people(); if (split.indexOf(v) < 0) split.push(v); body.querySelector('#kPeople').innerHTML = chips(); renderPeople(); share(); }
            return;
          }
          var p = btn.dataset.p;
          if (btn.parentNode.id === 'kPayer'){
            payer = p;
            body.querySelectorAll('#kPayer .chip').forEach(function(x){ x.classList.toggle('selected', x === btn); });
          } else {
            var i = split.indexOf(p);
            if (i >= 0) split.splice(i, 1); else split.push(p);
            btn.classList.toggle('selected', i < 0); share();
          }
        });
        var del = body.querySelector('#kDelete');
        if (del) del.addEventListener('click', function(){
          closeSheet();
          removeWithUndo('costs', c, 'Despesa «' + c.description + '» apagada.', TB.costs + '?id=eq.' + encodeURIComponent(c.id), costsChanged);
        });
        if (!editing) body.querySelector('#kDesc').focus();
      },
      onSave: function(body){
        var desc = body.querySelector('#kDesc').value.trim(), amount = parseAmount(body.querySelector('#kAmount').value);
        if (!desc){ sheetError('Escreve uma descrição.'); return false; }
        if (isNaN(amount) || amount <= 0){ sheetError('Escreve um valor válido, por exemplo 12,50.'); return false; }
        if (!split.length){ sheetError('Escolhe pelo menos uma pessoa para dividir a despesa.'); return false; }
        var f = { description: desc, amount: Math.round(amount * 100) / 100, paid_by: payer, category: cat,
                  split_with: all.filter(function(p){ return split.indexOf(p) >= 0; }) };
        if (editing){
          for (var k in f) c[k] = f[k];
          save('PATCH', TB.costs + '?id=eq.' + encodeURIComponent(c.id), f);
        } else {
          var nc = Object.assign({ id: uid() }, f);
          S.costs.push(nc);
          save('POST', TB.costs, [Object.assign({ trip_id: TRIP.id }, nc)]);
        }
        costsChanged();
      }
    });
  }
  function openSettleSheet(x){
    var today = isoDate(new Date());
    openSheet({
      title: 'Regularizar', saveLabel: 'Confirmar',
      html: '<div class="confirm-card"><div class="confirm-title">' + esc(x.from) + ' paga a ' + esc(x.to) + '</div>'
        + '<div class="confirm-meta">Em dívida: ' + money(x.amount) + '</div></div>'
        + '<div class="field"><label class="field-label" for="sAmount">Valor pago (' + esc(curSymbol()) + ')</label>'
        +   '<input class="field-input" id="sAmount" type="text" inputmode="decimal" value="' + x.amount.toFixed(2).replace('.', ',') + '">'
        +   '<div class="field-hint" id="sLeft"></div></div>'
        + '<div class="field"><label class="field-label" for="sDate">Data do pagamento</label>'
        +   '<input class="field-input" id="sDate" type="date" value="' + today + '" max="' + today + '"></div>',
      onOpen: function(body){
        function left(){
          var v = parseAmount(body.querySelector('#sAmount').value), el = body.querySelector('#sLeft');
          if (isNaN(v) || v <= 0) el.textContent = 'Altera o valor se o pagamento foi só de uma parte.';
          else if (v > x.amount + 0.005) el.textContent = 'O valor é superior ao que está em dívida.';
          else if (x.amount - v < 0.005) el.textContent = 'Pagamento total — a dívida fica saldada.';
          else el.textContent = 'Pagamento parcial — ficam ' + money(x.amount - v) + ' por pagar.';
        }
        left(); body.querySelector('#sAmount').addEventListener('input', left);
      },
      onSave: function(body){
        var v = Math.round(parseAmount(body.querySelector('#sAmount').value) * 100) / 100, date = body.querySelector('#sDate').value || today;
        if (isNaN(v) || v <= 0){ sheetError('Escreve um valor válido, por exemplo 12,50.'); return false; }
        if (v > x.amount + 0.005){ sheetError('O valor não pode ser superior ao que está em dívida (' + money(x.amount) + ').'); return false; }
        var row = { id: uid(), from_person: x.from, to_person: x.to, amount: v, paid_on: date, recorded_by: myName() || null };
        S.settlements.push(row);
        save('POST', TB.settlements, [Object.assign({ trip_id: TRIP.id }, row)]);
        costsChanged();
      }
    });
  }
  $('costSummary').addEventListener('click', function(e){
    var btn = closest(e, '.settle-btn'); if (!btn) return;
    var x = PENDING[Number(btn.dataset.i)]; if (x) openSettleSheet(x);
  });
  $('settleHistory').addEventListener('click', function(e){
    if (!closest(e, '.settle-undo')) return;
    var id = closest(e, '.settle-item').dataset.id, x = S.settlements.filter(function(r){ return r.id === id; })[0]; if (!x) return;
    removeWithUndo('settlements', x, 'Pagamento de ' + money(x.amount) + ' retirado.', TB.settlements + '?id=eq.' + encodeURIComponent(id), costsChanged);
  });
  function showCostPane(name){
    document.querySelectorAll('#costTabs button').forEach(function(b){ b.classList.toggle('selected', b.dataset.pane === name); });
    $('paneCostList').hidden = name !== 'list'; $('paneCostBalance').hidden = name !== 'balance';
    $('screen-custos').scrollTop = 0;
  }
  $('costTabs').addEventListener('click', function(e){ var b = closest(e, 'button'); if (b) showCostPane(b.dataset.pane); });
  $('costList').addEventListener('click', function(e){
    var item = closest(e, '.cost-item'); if (!item) return;
    var c = S.costs.filter(function(x){ return x.id === item.dataset.id; })[0];
    if (c) openCostSheet(c);
  });

  /* ============================================================
     NOTAS (practical tips)
     ============================================================ */
  function renderIdeas(){
    var box = $('ideasList'); if (!box || !TRIP) return;
    var ideas = S.stops.filter(function(s){ return s.day < 0; }), n = tripDays(TRIP), opts = '<option value="-1">Mover para um dia…</option>';
    for (var i = 0; i < n; i++) opts += '<option value="' + i + '">' + shortLabel(TRIP, i) + '</option>';
    $('ideasCount').textContent = ideas.length || '';
    box.innerHTML = ideas.length ? ideas.map(function(s){
      return '<div class="idea-item row" data-id="' + esc(s.id) + '"><span class="row-lead">' + ic('pin') + '</span><div class="idea-main row-text"><span class="row-title idea-name">' + esc(s.name) + '</span>'
        + (s.description ? '<span class="row-sub idea-desc">' + esc(s.description) + '</span>' : '')
        + '<select class="idea-day-select" aria-label="Mover para um dia">' + opts + '</select></div>'
        + '<button class="stop-remove idea-remove" aria-label="Remover">×</button></div>';
    }).join('') : '<div class="row-empty">Sem ideias guardadas. Usa o botão «+» para juntar sítios que ainda não têm dia.</div>';
  }
  $('ideasList').addEventListener('change', function(e){
    if (!e.target.classList.contains('idea-day-select')) return;
    var s = findStop(e.target.closest('.idea-item').dataset.id), d = Number(e.target.value);
    if (!s || d < 0) return;
    s.day = d; s.sort_order = null; stopsChanged(); patchStop(s.id, { day: d, sort_order: null });
    toast('«' + s.name + '» passou para ' + shortLabel(TRIP, d) + '.');
  });
  $('ideasList').addEventListener('click', function(e){
    if (!closest(e, '.idea-remove')) return;
    var s = findStop(closest(e, '.idea-item').dataset.id); if (!s) return;
    deleteStop(s);
  });
  function renderTips(){
    $('tipsCount').textContent = S.tips.length || '';
    $('tipsList').innerHTML = S.tips.length ? S.tips.map(function(t){
      return '<button class="note-card row" data-id="' + esc(t.id) + '"><span class="row-lead">' + ic('note') + '</span>'
        + '<span class="row-text"><span class="row-title">' + esc(t.title) + '</span>'
        + (t.tag ? '<span class="row-sub eyebrow">' + esc(t.tag) + '</span>' : '')
        + (t.body ? '<span class="row-body">' + esc(t.body) + '</span>' : '') + '</span>'
        + '<span class="row-chevron" aria-hidden="true">›</span></button>';
    }).join('') : '<div class="row-empty">Ainda sem notas. Usa o botão «+» para guardar o que convém saber antes de partir.</div>';
  }
  function openTipSheet(t){
    var editing = !!t;
    openSheet({
      title: editing ? 'Editar nota' : 'Nova nota', saveLabel: 'Adicionar', autosave: editing,
      html: '<div class="field"><label class="field-label" for="tTitle">Título</label><input class="field-input" id="tTitle" type="text" placeholder="Ex.: Bilhetes do museu" value="' + esc(editing ? t.title : '') + '"></div>'
        + '<div class="field"><label class="field-label" for="tTag">Etiqueta</label><input class="field-input" id="tTag" type="text" placeholder="Ex.: Reserva obrigatória" value="' + esc(editing ? t.tag : '') + '"></div>'
        + '<div class="field"><label class="field-label" for="tBody">Texto</label><textarea class="field-input" id="tBody" placeholder="O que convém saber…">' + esc(editing ? t.body : '') + '</textarea></div>'
        + (editing ? '<button type="button" class="danger-btn" id="tDelete">Apagar nota</button>' : ''),
      onOpen: function(body){
        var del = body.querySelector('#tDelete');
        if (del) del.addEventListener('click', function(){
          closeSheet();
          removeWithUndo('tips', t, 'Nota «' + t.title + '» apagada.', TB.tips + '?id=eq.' + encodeURIComponent(t.id), function(){ cacheState(); renderTips(); });
        });
        if (!editing) body.querySelector('#tTitle').focus();
      },
      onSave: function(body){
        var f = { title: body.querySelector('#tTitle').value.trim(), tag: body.querySelector('#tTag').value.trim(), body: body.querySelector('#tBody').value.trim() };
        if (!f.title){ sheetError('Dá um título à nota.'); return false; }
        if (editing){
          for (var k in f) t[k] = f[k];
          save('PATCH', TB.tips + '?id=eq.' + encodeURIComponent(t.id), f);
        } else {
          var nt = Object.assign({ id: uid(), trip_id: TRIP.id }, f);
          S.tips.push(nt); save('POST', TB.tips, [nt]);
        }
        cacheState(); renderTips();
      }
    });
  }
  $('tipsList').addEventListener('click', function(e){
    var card = closest(e, '.note-card'); if (!card) return;
    var t = S.tips.filter(function(x){ return x.id === card.dataset.id; })[0];
    if (t) openTipSheet(t);
  });

  /* ============================================================
     START
     ============================================================ */
  TRIPS = cacheGet('viagens_lista') || [];
  if (TRIPS.length){ sortTrips(); renderHome(); route(); }
  loadTrips().then(route);
})();
</script>
